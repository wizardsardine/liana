[package]
name = "coincube-core"
version = "0.9.0"
authors = ["Antoine Poinsot <darosior@protonmail.com>", "Coincube Team"]
edition = "2018"
repository = "https://github.com/coincubetech/coincube"
license-file = "LICENCE"
keywords = ["bitcoin", "wallet", "miniscript", "inheritance", "recovery", "liquid"]
description = "COINCUBE core development kit - Bitcoin wallet with Vault and Liquid spending"

[dependencies]
# For managing transactions (it re-exports the bitcoin crate)
miniscript = { version = "12.0", features = ["serde", "compiler", "base64"] }

# Coin selection algorithms for spend transaction creation.
bdk_coin_select = "0.4"
# We use TOML for the config, and JSON for RPC
serde = { version = "1.0", features = ["derive"] }

# Logging stuff
log = "0.4"

# Used for generating mnemonics
getrandom = "0.3.1"

# Used for the master signer
# `zeroize` makes `Mnemonic` scrub its own words on drop. Without it, every
# `MasterSigner` left its seed on the residual heap when it was dropped.
bip39 = { version = "2.0", features = ["zeroize"] }
argon2 = "0.5.3"
aes-gcm = "0.10.3"
zeroize = "1.8.2"
# HKDF-SHA256, used two places that both need extract-and-expand rather than
# a memory-hard KDF: WebAuthn-PRF → BIP39 entropy (the PRF output is already
# 256 uniform bits — Argon2 would add cost and no strength), and the seed
# file's v3 file-key combine (Argon2 hardens the low-entropy PIN half; HKDF
# just mixes it with the device secret).
hkdf = "0.12"
sha2 = "0.10"

[lints.clippy]
uninlined_format_args = "allow"
large_enum_variant = "allow"
result_large_err = "allow"

[lib]
doctest = false
