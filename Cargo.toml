[workspace]
resolver = "2"
members = [
    "fuzz",
    "coincube-mcp",
    "coincube-core",
    "coincube-keychain-ffi",
    "coincubed",
    "coincube-gui",
    "coincube-ui",
    "coincube-spark-protocol",
    "vendor/async-hwi",
]
# coincube-spark-bridge is deliberately NOT a member of this workspace.
# It links breez-sdk-spark, whose `rusqlite` (`links = "sqlite3"`) requirement
# can't be unified with coincubed's rusqlite 0.38 fork (breez/rusqlite,
# branch rusqlite-v0.38.0): Cargo allows one `sqlite3` link per graph. Making
# the bridge a standalone workspace (with its own Cargo.lock) gives it an
# isolated dep graph and lets it run beside the gui via stdin/stdout IPC.
# (This exclusion first existed because of breez-sdk-liquid, since removed.)
# See coincube-spark-bridge/Cargo.toml for its own [workspace] block.
exclude = ["coincube-spark-bridge", "vendor/branta"]
default-members = [
    "coincube-mcp",
    "coincube-core",
    "coincube-keychain-ffi",
    "coincubed",
    "coincube-gui",
    "coincube-ui",
    "coincube-spark-protocol",
]

[patch.crates-io]
# async-hwi 0.0.32 pins bitbox-api 0.9, which cannot sign OP_RETURN outputs.
# Vendor it with only the BitBox client updated to 0.11 (firmware >=9.24).
async-hwi = { path = "vendor/async-hwi" }

[profile.minimal]
inherits = "release"
opt-level = "z"
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"

# Debuginfo for everything built with the dev profile: local `cargo build`, and
# CI's clippy and test jobs. Full debuginfo across ~1200 dep crates was the bulk
# of target/debug. Release artifacts go through `--profile minimal` and are
# untouched. The cost is that panic backtraces lose line numbers inside
# dependencies; workspace crates keep theirs via `line-tables-only`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Branta vendor logos can have large source dimensions. Keep their bounded
# decode/thumbnail work within the lookup deadline in debug builds as well.
[profile.dev.package.image]
opt-level = 2

[profile.dev.package.png]
opt-level = 2

[profile.dev.package.fdeflate]
opt-level = 2

# Seed files are sealed with Argon2id at the production cost (256 MiB, t=3,
# p=4) in every coincube-gui test: `KdfParams::TEST` is `#[cfg(test)]` in
# coincube-core, so it only applies to coincube-core's own unit tests. At
# opt-level 0, and further slowed by llvm-cov instrumentation, those
# derivations dominated the GUI suite: 87 unlock-path tests ran for more
# than 60 s in coverage run 44465792951, whose lib tests took 4388 s.
# Optimising only the KDF crates keeps the production cost and every
# workspace code path and line count unchanged.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
