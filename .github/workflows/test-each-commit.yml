name: Commit history check
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  # first we list all commits
  list-commits:
    if: github.event.pull_request.commits > 1
    runs-on: ubuntu-latest
    outputs:
      commits: ${{ steps.list.outputs.commits }}
      slices: ${{ steps.slices.outputs.slices }}
      cache-prefix: ${{ steps.slices.outputs.cache-prefix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base branch
        run: |
          git fetch --no-tags --prune origin \
            "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"

      - id: list
        name: List intermediate commits
        run: |
          # HEAD is the PR tip -- already covered by main.yml.
          range="origin/${GITHUB_BASE_REF}..HEAD~"
          # Emit "<full sha>\t<short sha> <subject>" per commit, then turn
          # it into a JSON array of {sha, name} objects for matrix.include.
          commits=$(git log --reverse --format='%H%x09%h %s' "$range" \
            | jq -R -s -c '
                split("\n")
                | map(select(length > 0))
                | map(split("\t"))
                | map({sha: .[0], name: .[1]})
              ')
          echo "Intermediate commits: $commits"
          echo "commits=$commits" >> "$GITHUB_OUTPUT"

      - id: slices
        name: Read the crate slices
        run: |
          echo "slices=$(jq -c . .github/crate-slices.json)" >> "$GITHUB_OUTPUT"
          echo "cache-prefix=v0-rust-${{ hashFiles('.github/crate-slices.json') }}" >> "$GITHUB_OUTPUT"

  # then we check every commit: lints, then the tests and the release build of each crate slice
  lint-commit:
    needs: list-commits
    if: needs.list-commits.outputs.commits != '[]' && needs.list-commits.outputs.commits != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: ${{ matrix.commit.name }} (lint)
    strategy:
      fail-fast: false
      matrix:
        commit: ${{ fromJSON(needs.list-commits.outputs.commits) }}
    steps:
      # The install overlaps the toolchain and cache setup.
      - name: Start installing the system dependencies
        run: |
          (sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config libvulkan-dev libfontconfig1-dev
           echo $? > "$RUNNER_TEMP/apt.status") > "$RUNNER_TEMP/apt.log" 2>&1 &

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ matrix.commit.sha }}

      # rust-cache keys on every installed toolchain: keep the ones of the runner image out.
      - name: Use a toolchain directory of our own
        shell: bash
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ needs.list-commits.outputs.cache-prefix }}
          shared-key: ubuntu-latest-1.88.0
          save-if: false

      - name: Wait for the system dependencies
        run: |
          while [ ! -e "$RUNNER_TEMP/apt.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/apt.log"
          exit "$(cat "$RUNNER_TEMP/apt.status")"

      - name: Show commit
        run: git log -1 --oneline

      - name: fmt check
        run: cargo fmt -- --check

      - name: clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

  test-commit:
    needs: list-commits
    if: needs.list-commits.outputs.commits != '[]' && needs.list-commits.outputs.commits != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: ${{ matrix.commit.name }} (test ${{ matrix.slice.name }})
    strategy:
      fail-fast: false
      matrix:
        commit: ${{ fromJSON(needs.list-commits.outputs.commits) }}
        slice: ${{ fromJSON(needs.list-commits.outputs.slices) }}
    steps:
      # The install overlaps the toolchain and cache setup.
      - name: Start installing the system dependencies
        run: |
          (sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config libvulkan-dev libfontconfig1-dev
           echo $? > "$RUNNER_TEMP/apt.status") > "$RUNNER_TEMP/apt.log" 2>&1 &

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ matrix.commit.sha }}

      # rust-cache keys on every installed toolchain: keep the ones of the runner image out.
      - name: Use a toolchain directory of our own
        shell: bash
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ needs.list-commits.outputs.cache-prefix }}
          shared-key: ubuntu-latest-1.88.0
          save-if: false

      - name: List the crates of the slice in this commit
        id: packages
        run: |
          members=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name')
          packages=""
          for p in ${{ matrix.slice.packages }}; do
            if [ "$p" != -p ] && grep -qx "$p" <<< "$members"; then
              packages="$packages -p $p"
            fi
          done
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

      - name: Wait for the system dependencies
        run: |
          while [ ! -e "$RUNNER_TEMP/apt.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/apt.log"
          exit "$(cat "$RUNNER_TEMP/apt.status")"

      - name: Show commit
        run: git log -1 --oneline

      - name: tests
        if: steps.packages.outputs.packages != ''
        run: cargo test --verbose ${{ steps.packages.outputs.packages }} -- --nocapture

  release-commit:
    needs: list-commits
    if: needs.list-commits.outputs.commits != '[]' && needs.list-commits.outputs.commits != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: ${{ matrix.commit.name }} (release ${{ matrix.slice.name }})
    strategy:
      fail-fast: false
      matrix:
        commit: ${{ fromJSON(needs.list-commits.outputs.commits) }}
        slice: ${{ fromJSON(needs.list-commits.outputs.slices) }}
    steps:
      # The install overlaps the toolchain and cache setup.
      - name: Start installing the system dependencies
        run: |
          (sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config libvulkan-dev libfontconfig1-dev
           echo $? > "$RUNNER_TEMP/apt.status") > "$RUNNER_TEMP/apt.log" 2>&1 &

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ matrix.commit.sha }}

      # rust-cache keys on every installed toolchain: keep the ones of the runner image out.
      - name: Use a toolchain directory of our own
        shell: bash
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ needs.list-commits.outputs.cache-prefix }}
          shared-key: ubuntu-latest-release-${{ matrix.slice.name }}
          save-if: false

      - name: List the crates of the slice in this commit
        id: packages
        run: |
          members=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name')
          packages=""
          for p in ${{ matrix.slice.packages }}; do
            if [ "$p" != -p ] && grep -qx "$p" <<< "$members"; then
              packages="$packages -p $p"
            fi
          done
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

      - name: Wait for the system dependencies
        run: |
          while [ ! -e "$RUNNER_TEMP/apt.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/apt.log"
          exit "$(cat "$RUNNER_TEMP/apt.status")"

      - name: Show commit
        run: git log -1 --oneline

      - name: build
        if: steps.packages.outputs.packages != ''
        run: cargo build --release ${{ steps.packages.outputs.packages }}
