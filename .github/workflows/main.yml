name: CI

on:
  pull_request:
    branches:
      - master
      - redesign
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
      - converted_to_draft
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Optional full commit SHA to test (blank uses the selected branch)'
        required: false
        type: string

# A newer push to the same branch/PR supersedes the run in flight. Without
# this a burst of pushes queues one full matrix — macOS and Windows legs
# included — per commit, and only the last result is ever looked at.
# Manual validation runs are independent and must not be superseded by pushes.
concurrency:
  group: batch-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.ref }}-${{ github.event.action == 'edited' && github.event.changes.base == null && github.run_id || 'candidate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Build-time passkey flags, same repo-level Actions variables the release
# workflow uses. CI has to compile the *shipping* configuration: without these,
# every job here builds `PASSKEY_ENABLED = false` while releases ship `true`,
# so a green run says nothing about the binary that goes out — the passkey
# unlock path would never be type-checked, linted or tested until release day.
#
# Workflow-level, so it merges with (rather than replaces) the job-level `env`
# blocks in `linter` and `unit_tests` that carry `BREEZ_API_KEY`.
env:
  COINCUBE_ENABLE_PASSKEY: ${{ vars.COINCUBE_ENABLE_PASSKEY }}
  COINCUBE_PASSKEY_RP_ID: ${{ vars.COINCUBE_PASSKEY_RP_ID }}

jobs:
  linter:
    if: ${{ (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.base != null))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BREEZ_API_KEY: ${{ github.event_name == 'push' && secrets.BREEZ_API_KEY || 'DUMMY_BREEZ_API_KEY' }}
    steps:
      # Manual runs may test a pinned integrated tree using this workflow.
      # PR runs retain checkout's default synthetic merge ref.
      - name: Validate manual source SHA
        if: github.event_name == 'workflow_dispatch' && inputs.source_sha != ''
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || '' }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt -- --check
      - name: clippy
        run: |
          sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config protobuf-compiler libdbus-1-dev libwebkit2gtk-4.1-dev
          cargo clippy --all-targets -- -D warnings
          cargo clippy -p coincube-gui --no-default-features --all-targets --locked -- -D warnings

  mcp_tests:
    if: ${{ (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.base != null))) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # This matrix runs independently of linter, so validate before checkout too.
      - name: Validate manual source SHA
        if: github.event_name == 'workflow_dispatch' && inputs.source_sha != ''
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || '' }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.97.1
          components: clippy
      - run: cargo test -p coincube-mcp --features adapter --locked
      - run: cargo test -p coincube-mcp --no-default-features --features adapter --locked
      - run: cargo test -p coincube-mcp --no-default-features --features adapter,native-proposals --locked
      - run: cargo test -p coincube-mcp --no-default-features --features adapter,native-transactions --locked
      - run: cargo clippy -p coincube-mcp --features adapter --all-targets --locked -- -D warnings

  # coincube-spark-bridge is excluded from the root workspace (see the root
  # Cargo.toml), so the bare `cargo test` in unit_tests does not reach it and
  # its 15 tests had never run in CI. Its Cargo.lock is its own, hence the
  # distinct cache key — sharing the root's would thrash both.
  bridge_tests:
    if: ${{ (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.base != null))) }}
    needs: linter
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BREEZ_API_KEY: ${{ github.event_name == 'push' && secrets.BREEZ_API_KEY || 'DUMMY_BREEZ_API_KEY' }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || '' }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config protobuf-compiler
      - name: Cache Cargo (bridge workspace)
        uses: actions/cache@v5
        with:
          key: cargo-bridge-${{ runner.os }}-${{ hashFiles('coincube-spark-bridge/Cargo.lock') }}
          restore-keys: cargo-bridge-${{ runner.os }}-
          path: coincube-spark-bridge/target
      - name: clippy
        run: cargo clippy --manifest-path coincube-spark-bridge/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path coincube-spark-bridge/Cargo.toml

  # vendor/branta is also excluded from the root workspace, so the bare
  # `cargo test` never runs the vendored Branta SDK's own suite or the Tenshu
  # client.rs patch tests. The wallet relies on that suite for decrypt-and-bind
  # behavior. All of it is offline (local mock servers); the SDK's live
  # integration tests are under tests/, which is not vendored, and --lib keeps
  # examples out. The crate has no lockfile of its own: seed it from the root
  # Cargo.lock so shared dependencies resolve to the reviewed versions. Its
  # test-only dependencies the root lock lacks (wiremock, tokio-test) still
  # resolve to the newest compatible release; they never ship in the wallet.
  branta_vendor_tests:
    needs: linter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || '' }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.97.1
      - name: Test
        run: |
          cp Cargo.lock vendor/branta/Cargo.lock
          cargo test --manifest-path vendor/branta/Cargo.toml --lib

  # Run Linux, macOS and Windows on every PR and push so platform-specific
  # failures are caught before merge (#475). Linux also runs advisory canaries.
  #
  # A helper job rather than a job-level `if` on unit_tests: `matrix` is not
  # in scope when `jobs.<id>.if` is evaluated (only github, needs, vars and
  # inputs are), so `if: matrix.os == ... || ...` is silently false on every
  # PR and skips the Linux legs too. `strategy.matrix` does see `needs`.
  unit_tests_matrix:
    if: ${{ (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.base != null))) }}
    name: Select unit_tests matrix
    needs: linter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        run: |
          linux='[{"os":"ubuntu-latest","toolchain":"pinned"},{"os":"ubuntu-latest","toolchain":"stable"},{"os":"ubuntu-latest","toolchain":"nightly"}]'
          desktop='[{"os":"macOS-latest","toolchain":"pinned"},{"os":"windows-latest","toolchain":"pinned"}]'
          include=$(jq -c -n --argjson a "$linux" --argjson b "$desktop" '$a + $b')
          echo "selected matrix: $include"
          echo "include=$include" >> "$GITHUB_OUTPUT"

  unit_tests:
    if: ${{ (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.base != null))) }}
    needs: [linter, unit_tests_matrix]
    strategy:
      # Don't cancel the whole matrix when one leg fails: a flaky Windows job
      # was masking otherwise-green macOS/ubuntu results and forcing full
      # re-runs to see them.
      fail-fast: false
      # `pinned` means "whatever rust-toolchain.toml selects" — the version we
      # actually ship, gated on every OS. `stable` and `nightly` are advisory
      # canaries for the next toolchain bump and run on ubuntu only; see
      # `continue-on-error` below for why they do not gate.
      #
      # This used to be a `toolchain: [stable, nightly]` x `os: [...]` product,
      # which never did what it claimed: `rustup default` loses to
      # rust-toolchain.toml, so all six legs silently ran the pinned toolchain
      # and each OS was tested twice over. Overriding the file needs
      # RUSTUP_TOOLCHAIN (env beats rust-toolchain.toml in rustup's precedence
      # order), not `rustup default`.
      #
      # The legs themselves are listed in `unit_tests_matrix` above: all three
      # ubuntu legs on every event, plus macOS-latest and windows-latest
      # (pinned) on every PR and push.
      matrix:
        include: ${{ fromJSON(needs.unit_tests_matrix.outputs.include) }}
    runs-on: ${{ matrix.os }}
    # A green leg finishes in well under an hour; the default cap is 6 hours.
    # A single hung test (`server_sanity_check` waited forever on a socket path
    # the daemon no longer creates) burned 6 runner-hours per push for weeks and
    # left ubuntu with no reported result at all. Fail fast instead.
    timeout-minutes: 120
    # The canaries are informational: a newer toolchain breaking is upstream's
    # doing, not the PR's, and blocking merges on it just teaches people to
    # ignore a red tick. Their failures are still visible in the run.
    continue-on-error: ${{ matrix.toolchain != 'pinned' }}
    env:
      BREEZ_API_KEY: ${{ github.event_name == 'workflow_dispatch' && 'DUMMY_BREEZ_API_KEY' || secrets.BREEZ_API_KEY }}
      # Empty for the pinned legs, which leaves rust-toolchain.toml in charge —
      # rustup ignores an empty RUSTUP_TOOLCHAIN rather than erroring on it.
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain != 'pinned' && matrix.toolchain || '' }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || '' }}
          persist-credentials: false
      # Nothing to install for the pinned legs: rustup provisions the toolchain
      # named by rust-toolchain.toml on first use. The canaries pin no such file
      # and so must be installed before RUSTUP_TOOLCHAIN can select them.
      - name: Install Rust ${{ matrix.toolchain }} toolchain
        if: matrix.toolchain != 'pinned'
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      # Windows Defender's real-time scanning briefly locks files the tests
      # have just written under %TEMP%, so a follow-up read/enumerate can miss
      # them and surface as os error 2/3/5. Exclude the temp/work dirs (and drop
      # real-time monitoring as a fallback) so the filesystem-heavy tests aren't
      # racing an antivirus scan. Best-effort: ignore failures if a cmdlet is
      # blocked, since the code paths are also hardened with bounded retries.
      - name: Reduce Defender interference (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:TEMP -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath $env:RUNNER_TEMP -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE -ErrorAction SilentlyContinue
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
      # Chocolatey updates the machine PATH, which a new PowerShell process
      # reloads. Keep installation separate from Cargo so prost-build can find
      # protoc on runners where it was not already present.
      - name: Install Windows dependencies
        if: matrix.os == 'windows-latest'
        run: choco install protoc --yes --no-progress
      - name: Test on Rust ${{ matrix.toolchain }} (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        # Cap test parallelism: the filesystem-heavy tests create files under
        # %TEMP% and immediately read them back, and running many at once
        # multiplies the odds that Defender is mid-scan on one of them. Test
        # execution includes an observed ~75-minute GUI run. Keep its existing
        # two-thread budget, with the native feature suites in a separate job.
        run: |
          cargo test --no-default-features -- --test-threads=2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python contrib/check_windows_binary.py target/debug/coincube.exe
      # TMPDIR is redirected off `/var/folders/.../T`, macOS's per-user temp
      # directory, which the OS purges under disk pressure. Two tests that write
      # a datadir there failed on this runner and nowhere else, and the
      # diagnostics show the failure exactly: a root that `create_dir_all` had
      # just created reports `exists=false` a few seconds later, and the tests
      # created before the purge are the ones that fail. `runner.temp` lives on
      # the workspace volume and is not purgeable.
      - name: Test on Rust ${{ matrix.toolchain }} (Unix)
        if: matrix.os == 'macOS-latest'
        env:
          PROTOC: /opt/homebrew/bin/protoc
          TMPDIR: ${{ runner.temp }}
        # The trailing `df` is the measurement that matters, and it is only
        # interesting when the tests fail — so it must not be skipped when they
        # do. A `run:` block is `bash -e`, which aborts the step on the failing
        # `cargo test`, and the last run lost the after-reading for that reason.
        # Capture the status, take the reading, then fail with it.
        run: |
          brew install protobuf
          df -h / "$TMPDIR"
          status=0
          cargo test --color always -- --nocapture || status=$?
          df -h / "$TMPDIR"
          exit $status
      # The device-secret tests are not mockable by design: they exercise the
      # real Secret Service, because "the key half lives in the OS keystore" is
      # the property under test. A bare runner has no session bus and no keyring
      # daemon, so `org.freedesktop.secrets` is unavailable and every test that
      # provisions or reads a device secret fails — 37 of them, all with the same
      # `KeystoreUnreachable` error. Give the suite a session bus with an
      # unlocked (empty-password) login keyring instead of gating the tests off,
      # which would drop keystore coverage on the one platform that can run it
      # unsigned.
      #
      # Starting the daemon is not enough on its own: the runner has no keyring
      # file, so the Secret Service answers a lookup for the *default*
      # collection with "no result found". Minting it with `secret-tool store`
      # does not work either — it fails with "Object does not exist at path
      # /org/freedesktop/secrets/collection/login" rather than creating the
      # collection. Write the empty-password login keyring and its default
      # alias directly, before the daemon starts.
      - name: Test on Rust ${{ matrix.toolchain }} (Unix)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libfontconfig1-dev pkg-config libdbus-1-dev protobuf-compiler libwebkit2gtk-4.1-dev gnome-keyring dbus-x11
          mkdir -p ~/.local/share/keyrings
          printf '[keyring]\ndisplay-name=login\nctime=0\nmtime=0\nlock-on-idle=false\nlock-after=false\n' > ~/.local/share/keyrings/login.keyring
          printf 'login' > ~/.local/share/keyrings/default
          python3 contrib/test_keyring_supervision.py
          python3 contrib/test_keyring_supervision.py --live-kill
          dbus-run-session -- python3 contrib/with_test_keyring.py -- cargo test --color always -- --nocapture
      - name: Real wallet through installed STDIO companion
        if: matrix.toolchain == 'pinned' && runner.os != 'Windows'
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          cargo build -p coincube-mcp --features adapter --locked
          adapter="$PWD/target/debug/tenshu-mcp"
          TENSHU_MCP_TEST_ADAPTER="$adapter" cargo test -p coincube-gui --lib stdio_client_reads_real_wallet_and_observes_revocation -- --ignored
          TENSHU_MCP_TEST_ADAPTER="$adapter" cargo test -p coincube-gui --lib stdio_acceptance_tests --locked -- --ignored --test-threads=1
      - name: Wallet proposals, transactions and native lock boundaries
        if: matrix.toolchain == 'pinned' && matrix.os != 'windows-latest'
        env:
          BREEZ_API_KEY: DUMMY_REGTEST_ONLY
          TMPDIR: ${{ runner.temp }}
        run: |
          cargo test -p coincube-gui --lib --features mcp-proposals,mcp-transactions --locked proposal -- --test-threads=2
          cargo test -p coincube-gui --lib --features mcp-proposals,mcp-transactions --locked mcp_transaction -- --test-threads=2
      # The Testnet4 seed-resume gate is compiled only with `integration-tests`
      # (it is the native test runner's resume path), so the bare `cargo test`
      # above never reaches its unit tests. They are offline — no API, no
      # keystore — so run that one module with the feature on every leg.
      - name: Testnet4 seed-resume gate tests
        if: matrix.os != 'windows-latest'
        env:
          TMPDIR: ${{ runner.temp }}
        run: cargo test -p coincube-gui ${{ matrix.os == 'windows-latest' && '--no-default-features' || '' }} --features integration-tests --lib installer::testnet4_seed_resume_tests
      - name: Preserve Secret Service fixture diagnostics
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: keyring-fixture-${{ matrix.toolchain }}
          path: test-logs/gnome-keyring.log
          if-no-files-found: ignore

  windows_native_boundaries:
    name: Windows native boundaries (pinned)
    if: ${{ (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.base != null))) }}
    needs: linter
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      BREEZ_API_KEY: ${{ github.event_name == 'workflow_dispatch' && 'DUMMY_BREEZ_API_KEY' || secrets.BREEZ_API_KEY }}
      RUSTUP_TOOLCHAIN: ''
    steps:
      - name: Validate manual source SHA
        if: github.event_name == 'workflow_dispatch' && inputs.source_sha != ''
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || '' }}
          persist-credentials: false
      - name: Reduce Defender interference (Windows)
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:TEMP -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath $env:RUNNER_TEMP -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE -ErrorAction SilentlyContinue
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
      - name: Install Windows dependencies
        run: choco install protoc --yes --no-progress
      - name: Windows MCP adapter and STDIO boundaries
        shell: pwsh
        run: |
          cargo build -p coincube-mcp --features adapter --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TENSHU_MCP_TEST_ADAPTER = Join-Path $PWD 'target/debug/tenshu-mcp.exe'
          cargo test -p coincube-gui --lib app::local_mcp::tests --no-default-features --locked -- --include-ignored --test-threads=2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p coincube-gui --lib stdio_acceptance_tests --no-default-features --features mcp-proposals,mcp-transactions --locked -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:TENSHU_MCP_TEST_ADAPTER
      - name: Wallet proposals, transactions and native lock boundaries
        shell: pwsh
        env:
          BREEZ_API_KEY: DUMMY_REGTEST_ONLY
          TMPDIR: ${{ runner.temp }}
        run: |
          cargo test -p coincube-gui --lib --features mcp-proposals,mcp-transactions --locked proposal -- --test-threads=2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p coincube-gui --lib --features mcp-proposals,mcp-transactions --locked mcp_transaction -- --test-threads=2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Testnet4 seed-resume gate tests
        shell: pwsh
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          cargo test -p coincube-gui --no-default-features --features integration-tests --lib installer::testnet4_seed_resume_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p coincube-gui --no-default-features --features integration-tests --lib recovery_native::tests::oracle_diagnostic_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p coincube-gui --no-default-features --features integration-tests --lib home::integration::tests::qa_initialization_never_overwrites_existing_off_or_unknown_profile_state -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows_ci_complete:
    name: Windows CI complete
    if: ${{ always() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.base != null))) }}
    needs: [unit_tests, windows_native_boundaries]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both Windows workloads
        shell: bash
        env:
          UNIT_TESTS_RESULT: ${{ needs.unit_tests.result }}
          WINDOWS_NATIVE_RESULT: ${{ needs.windows_native_boundaries.result }}
        run: |
          printf 'unit_tests=%s\nwindows_native_boundaries=%s\n' "$UNIT_TESTS_RESULT" "$WINDOWS_NATIVE_RESULT"
          [[ "$UNIT_TESTS_RESULT" == 'success' && "$WINDOWS_NATIVE_RESULT" == 'success' ]]
