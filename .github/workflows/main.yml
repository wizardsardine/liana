name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  linter:
    runs-on: ubuntu-latest
    env:
      BREEZ_API_KEY: ${{ github.event_name == 'push' && secrets.BREEZ_API_KEY || 'DUMMY_BREEZ_API_KEY' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt -- --check
      - name: clippy
        run: |
          sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config protobuf-compiler libdbus-1-dev libwebkit2gtk-4.1-dev
          cargo clippy --all-targets -- -D warnings

  unit_tests:
    needs: linter
    strategy:
      # Don't cancel the whole matrix when one leg fails: a flaky Windows job
      # was masking otherwise-green macOS/ubuntu results and forcing full
      # re-runs to see them.
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - nightly
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      BREEZ_API_KEY: ${{ secrets.BREEZ_API_KEY }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Install Rust ${{ matrix.toolchain }} toolchain
        run: |
          rustup update ${{ matrix.toolchain }}
          rustup default ${{ matrix.toolchain }}
      # Windows Defender's real-time scanning briefly locks files the tests
      # have just written under %TEMP%, so a follow-up read/enumerate can miss
      # them and surface as os error 2/3/5. Exclude the temp/work dirs (and drop
      # real-time monitoring as a fallback) so the filesystem-heavy tests aren't
      # racing an antivirus scan. Best-effort: ignore failures if a cmdlet is
      # blocked, since the code paths are also hardened with bounded retries.
      - name: Reduce Defender interference (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:TEMP -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath $env:RUNNER_TEMP -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE -ErrorAction SilentlyContinue
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
      - name: Test on Rust ${{ matrix.toolchain }} (Windows)
        if: matrix.os == 'windows-latest'
        # Cap test parallelism: the filesystem-heavy tests create files under
        # %TEMP% and immediately read them back, and running many at once
        # multiplies the odds that Defender is mid-scan on one of them. Test
        # execution is only seconds of this build-dominated job, so the lower
        # concurrency costs little and, with the in-code retries, removes the
        # remaining Windows flakiness.
        run: |
          choco install protoc --yes --no-progress
          cargo test --no-default-features -- --test-threads=2
      # TMPDIR is redirected off `/var/folders/.../T`, macOS's per-user temp
      # directory, which the OS purges under disk pressure. Two tests that write
      # a datadir there failed on this runner and nowhere else, and the
      # diagnostics show the failure exactly: a root that `create_dir_all` had
      # just created reports `exists=false` a few seconds later, and the tests
      # created before the purge are the ones that fail. `runner.temp` lives on
      # the workspace volume and is not purgeable.
      - name: Test on Rust ${{ matrix.toolchain }} (Unix)
        if: matrix.os == 'macOS-latest'
        env:
          PROTOC: /opt/homebrew/bin/protoc
          TMPDIR: ${{ runner.temp }}
        run: |
          brew install protobuf
          df -h / "$TMPDIR"
          cargo test --color always -- --nocapture
          df -h / "$TMPDIR"
      # The device-secret tests are not mockable by design: they exercise the
      # real Secret Service, because "the key half lives in the OS keystore" is
      # the property under test. A bare runner has no session bus and no keyring
      # daemon, so `org.freedesktop.secrets` is unavailable and every test that
      # provisions or reads a device secret fails — 37 of them, all with the same
      # `KeystoreUnreachable` error. Give the suite a session bus with an
      # unlocked (empty-password) login keyring instead of gating the tests off,
      # which would drop keystore coverage on the one platform that can run it
      # unsigned.
      #
      # Starting the daemon is not enough on its own: the runner has no keyring
      # file yet, so the Secret Service answers a lookup for the *default*
      # collection with "no result found" and the same tests fail for a new
      # reason. Storing one item mints the default (login) collection, after
      # which a lookup for an absent entry correctly reports "no entry" — the
      # distinction `missing_entry_is_its_own_error` exists to check.
      - name: Test on Rust ${{ matrix.toolchain }} (Unix)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libfontconfig1-dev pkg-config libdbus-1-dev protobuf-compiler libwebkit2gtk-4.1-dev gnome-keyring dbus-x11 libsecret-tools
          dbus-run-session -- bash -c '
            echo -n "" | gnome-keyring-daemon --daemonize --unlock --components=secrets >/dev/null
            echo -n "ci" | secret-tool store --label=ci-bootstrap coincube ci-bootstrap
            secret-tool lookup coincube ci-bootstrap >/dev/null
            cargo test --color always -- --nocapture
          '
