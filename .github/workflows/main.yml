name: CI

on:
  push:
  pull_request:

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rs/toolchain@v1
        with:
            toolchain: 1.88.0
            components: rustfmt, clippy
            override: true
      - name: rustfmt
        run: cargo fmt -- --check
      - name: clippy
        run: |
          sudo apt-get update &&
          sudo apt-get install --allow-downgrades libudev-dev pkg-config libvulkan-dev &&
          cargo clippy --all-features --all-targets -- -D warnings

  unit_tests:
    needs: linter
    strategy:
      matrix:
        toolchain:
          - 1.88.0
          - nightly
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2
      - name: Install Rust ${{ matrix.toolchain }} toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          override: true
          profile: minimal
      - name: Test on Rust ${{ matrix.toolchain }} (only Windows)
        if: matrix.os == 'windows-latest'
        run: cargo test --verbose --no-default-features
      - name: Test on Rust ${{ matrix.toolchain }} (non Windows)
        if: matrix.os == 'macOS-latest'
        run: cargo test --verbose --color always -- --nocapture
      - name: Test on Rust ${{ matrix.toolchain }} (non Windows)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update &&
          sudo apt-get install libudev-dev libfontconfig1-dev &&
          cargo test --verbose --color always -- --nocapture

  template_images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
            toolchain: 1.88.0
            components: rustfmt
            override: true
      - name: Install the pinned Typst release
        run: |
          curl -sSfL -o typst.tar.xz https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          echo "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  typst.tar.xz" | sha256sum -c -
          tar -xJf typst.tar.xz
          echo "$PWD/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Check the generated template images are up to date
        run: cargo xtask gen-images --check
