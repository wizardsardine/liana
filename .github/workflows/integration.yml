name: Functional Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  functional-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - USE_TAPROOT: 0
            BITCOIN_BACKEND_TYPE: "bitcoind"
            USE_MIN_BITCOIN_VERSION: "TRUE"
          - USE_TAPROOT: 0
            BITCOIN_BACKEND_TYPE: "bitcoind"
          - USE_TAPROOT: 1
            BITCOIN_BACKEND_TYPE: "bitcoind"
          # Bitcoin Knots with BIP-110 (RDTS) enforced on regtest. Exercises the
          # managed-Knots backend and the broadcast-path regression test under
          # Knots policy (USE_TAPROOT=1 covers the P2TR send).
          - USE_TAPROOT: 1
            BITCOIN_BACKEND_TYPE: "bitcoind"
            USE_KNOTS: "TRUE"
            ENFORCE_RDTS: "1"
          - USE_TAPROOT: 0
            BITCOIN_BACKEND_TYPE: "electrs"
            USE_MIN_BITCOIN_VERSION: "TRUE"
          - USE_TAPROOT: 0
            BITCOIN_BACKEND_TYPE: "electrs"
          - USE_TAPROOT: 1
            BITCOIN_BACKEND_TYPE: "electrs"

    env:
      BREEZ_API_KEY: ${{ github.event_name == 'push' && secrets.BREEZ_API_KEY || 'DUMMY_BREEZ_API_KEY' }}
      EXECUTOR_WORKERS: 3
      VERBOSE: 0
      LOG_LEVEL: debug
      TIMEOUT: 120
      USE_MIN_BITCOIN_VERSION: ${{ matrix.USE_MIN_BITCOIN_VERSION }}
      USE_TAPROOT: ${{ matrix.USE_TAPROOT }}
      BITCOIN_BACKEND_TYPE: ${{ matrix.BITCOIN_BACKEND_TYPE }}
      USE_KNOTS: ${{ matrix.USE_KNOTS }}
      ENFORCE_RDTS: ${{ matrix.ENFORCE_RDTS }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy

      - name: Setup Python dependencies
        run: pip install --break-system-packages -r tests/requirements.txt

      - name: Add local bin to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache target/
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-target-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('tests/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Build coincubed and taproot_signer
        run: |
          cargo build --release --package coincubed
          cd ./tests/tools/taproot_signer
          cargo build --release
      - name: Prepare and run functional tests
        run: |
          set -xe
          if [ "$USE_KNOTS" = "TRUE" ]; then
            # Bitcoin Knots, verified the way the desktop installer does: the
            # archive's checksum must appear in the release SHA256SUMS, and
            # SHA256SUMS.asc must verify against the pinned Knots signing key.
            KNOTS_VERSION=29.3.knots20260508
            KNOTS_DIR=https://bitcoinknots.org/files/29.x/$KNOTS_VERSION
            KNOTS_ARCHIVE=bitcoin-$KNOTS_VERSION-x86_64-linux-gnu.tar.gz
            KNOTS_KEY=1A3E761F19D2CC7785C5502EA291A2C45D0C504A
            curl -O $KNOTS_DIR/$KNOTS_ARCHIVE
            curl -O $KNOTS_DIR/SHA256SUMS
            curl -O $KNOTS_DIR/SHA256SUMS.asc
            gpg --keyserver hkps://keyserver.ubuntu.com --recv-keys $KNOTS_KEY
            # The detached signature file is a concatenation from several
            # maintainers. GPG exits non-zero when any signer key is missing,
            # even after the pinned signer verifies successfully, so require
            # that signer's VALIDSIG status explicitly.
            gpg --status-fd 1 --verify SHA256SUMS.asc SHA256SUMS \
              >gpg-status.txt 2>&1 || true
            grep -q "^\[GNUPG:\] VALIDSIG $KNOTS_KEY " gpg-status.txt
            sha256sum --ignore-missing -c SHA256SUMS
            tar -xzf $KNOTS_ARCHIVE
            export BITCOIND_PATH=bitcoin-$KNOTS_VERSION/bin/bitcoind
          elif [ "$USE_MIN_BITCOIN_VERSION" = "TRUE" ]; then
            curl -O https://bitcoincore.org/bin/bitcoin-core-24.0.1/bitcoin-24.0.1-x86_64-linux-gnu.tar.gz
            echo "49df6e444515d457ea0b885d66f521f2a26ca92ccf73d5296082e633544253bf bitcoin-24.0.1-x86_64-linux-gnu.tar.gz" | sha256sum -c
            tar -xzf bitcoin-24.0.1-x86_64-linux-gnu.tar.gz
            export BITCOIND_PATH=bitcoin-24.0.1/bin/bitcoind
            export IS_NOT_BITCOIND_24=0
          else
            curl -O https://bitcoincore.org/bin/bitcoin-core-29.0/bitcoin-29.0-x86_64-linux-gnu.tar.gz
            echo "a681e4f6ce524c338a105f214613605bac6c33d58c31dc5135bbc02bc458bb6c bitcoin-29.0-x86_64-linux-gnu.tar.gz" | sha256sum -c
            tar -xzf bitcoin-29.0-x86_64-linux-gnu.tar.gz
            export BITCOIND_PATH=bitcoin-29.0/bin/bitcoind
          fi
          echo "BITCOIN_BACKEND_TYPE = $BITCOIN_BACKEND_TYPE"
          if [ "$BITCOIN_BACKEND_TYPE" = "electrs" ]; then
            curl -OL https://github.com/jp1ac4/electrsd/releases/download/electrs-v0.10.6-ubuntu-20.04/electrs_linux_v0.10.6.zip
            echo "34934bedbc4003867353f23c7983d4aa2d901dfccfd0bd74167f9fd305c56f7b electrs_linux_v0.10.6.zip" | sha256sum -c
            unzip electrs_linux_v0.10.6.zip
            chmod 754 electrs
            export ELECTRS_PATH=$PWD/electrs
          fi
          # The migration test (tests/test_misc.py::test_migration) needs a
          # genuinely-old coincubed binary to build a legacy datadir. Upstream
          # Liana shipped `lianad` in its release archive and pointed
          # OLD_LIANAD_PATH straight at it; Coincube's releases ship only the
          # `coincube` GUI (the v1.0.0 linux tarball contains coincube/LICENCE/
          # README.md — no coincubed). The old `find $PWD -name coincubed`
          # therefore matched nothing from a release and silently fell through
          # to the freshly-built target/release/coincubed, turning the migration
          # test into a meaningless new-vs-new comparison that passes only
          # because the current daemon's version (0.9.0) happens to be in the
          # accepted set. Leave OLD_COINCUBED_PATH unset so test_migration skips
          # honestly. To restore real coverage, publish a coincubed binary as a
          # release asset and point OLD_COINCUBED_PATH at it explicitly here.
          # Run the functional tests
          if [ "$USE_KNOTS" = "TRUE" ]; then
            # This leg exists to validate standard transaction relay under the
            # managed Knots/RDTS policy. The generic daemon suite is covered by
            # the six Core bitcoind/electrs legs above.
            pytest tests/test_knots.py -vvv
          elif [ "$BITCOIN_BACKEND_TYPE" = "electrs" ]; then
            # Deep reorg indexing is I/O-heavy and can starve when eight
            # bitcoind/electrs pairs run together (the daemon stops answering
            # RPC mid-reorg and the call times out). Keep the broad suite
            # parallel, then exercise every simple_reorg-driven test
            # deterministically on its own with a higher timeout.
            pytest tests/ -vvv -n 8 \
              --deselect tests/test_chain.py::test_reorg_detection \
              --deselect tests/test_chain.py::test_reorg_exclusion \
              --deselect tests/test_chain.py::test_reorg_status_recovery \
              --deselect tests/test_chain.py::test_rescan_edge_cases
            TIMEOUT=240 pytest \
              tests/test_chain.py::test_reorg_detection \
              tests/test_chain.py::test_reorg_exclusion \
              tests/test_chain.py::test_reorg_status_recovery \
              tests/test_chain.py::test_rescan_edge_cases -vvv
          else
            pytest tests/ -vvv -n 8
          fi
