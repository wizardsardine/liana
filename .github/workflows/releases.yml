name: Coincube Release Workflow

permissions:
  contents: write

on:
  push:
    tags:
      - "v*.*"
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_LTO: true
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
  BREEZ_API_KEY: ${{ github.event_name == 'push' && secrets.BREEZ_API_KEY || 'DUMMY_BREEZ_API_KEY' }}
  COINCUBE_API_URL: ${{ vars.COINCUBE_API_URL }}

jobs:
  release:
    name: Build & Release
    if: github.repository == 'coincubetech/coincube'
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux

          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows

          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64

          # macOS Intel
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install common tooling
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-wix,apple-codesign,jaq

      - name: Set Coincube version from Cargo
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jaq -r '.packages[] | select(.name=="coincube-gui") | .version')
          echo "COINCUBE_VERSION=$version" >> $GITHUB_ENV

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
          path: target

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          makeLatest: true
          name: Coincube v${{ env.COINCUBE_VERSION }}
          body: Installers for Windows, macOS and Linux
          allowUpdates: true

      - name: Generate Icons for Installers
        if: matrix.platform != 'linux'
        run: |
          pip install pillow icnsutil
          python contrib/release/macos/icns-creator.py

      # --------------------------------------------------
      # Linux
      # --------------------------------------------------

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config protobuf-compiler libdbus-1-dev libwebkit2gtk-4.1-dev

      - name: Upload Linux binary
        if: matrix.platform == 'linux'
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          package: coincube-gui
          bin: coincube
          archive: tenshu-${{ env.COINCUBE_VERSION }}-${{ matrix.target }}
          target: ${{ matrix.target }}
          include: LICENCE,README.md
          profile: minimal
          locked: true

      # --------------------------------------------------
      # Windows
      # --------------------------------------------------

      - name: Install Windows dependencies
        if: matrix.platform == 'windows'
        run: choco install protoc --yes --no-progress

      - name: Build Windows MSI
        if: matrix.platform == 'windows'
        run: |
          cargo build --package coincube-gui --profile minimal --locked
          cargo wix --package coincube-gui --no-build --profile minimal --output "target/wix/tenshu-${{ env.COINCUBE_VERSION }}-${{ matrix.target }}.msi" --include ./contrib/release/wix/main.wxs --nocapture -v

      - name: Upload Windows MSI
        if: matrix.platform == 'windows'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/wix/tenshu-${{ env.COINCUBE_VERSION }}-${{ matrix.target }}.msi
          tag: ${{ github.ref }}
          overwrite: true

      # --------------------------------------------------
      # macOS (arm64 + x64)
      # --------------------------------------------------

      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        run: brew install protobuf create-dmg

      - name: Prepare Apple Developer ID certificate
        if: matrix.platform == 'macos'
        env:
          P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.CERTIFICATE_P12_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > cert.p12
          echo "$P12_PASSWORD" > cert.pass

      - name: Build Coincube (macOS ${{ matrix.arch }})
        if: matrix.platform == 'macos'
        env:
          PROTOC: /opt/homebrew/bin/protoc
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --package coincube-gui --profile minimal --target ${{ matrix.target }} --locked

      - name: Assemble .app bundle
        if: matrix.platform == 'macos'
        run: |
          unzip contrib/release/macos/_coincube.zip
          sed -i '' "s/VERSION_PLACEHOLDER/${{ env.COINCUBE_VERSION }}/g" Tenshu.app/Contents/Info.plist

          # Guard the checked-in bundle template before anything is copied
          # into it. A wrong CFBundleIdentifier desyncs the keychain access
          # group in coincube.entitlements (<TeamID>.<bundleID>) and strands
          # device secrets; missing Bonjour keys break the LAN signer only
          # once the build is on a user's machine.
          plist=Tenshu.app/Contents/Info.plist
          bundle_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$plist")
          [ "$bundle_id" = "io.coincube.tenshu" ] \
            || { echo "unexpected CFBundleIdentifier: $bundle_id"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :NSLocalNetworkUsageDescription" "$plist" > /dev/null \
            || { echo "NSLocalNetworkUsageDescription missing from Info.plist"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :NSBonjourServices:0" "$plist" | grep -qx '_coincube-signer._tcp' \
            || { echo "_coincube-signer._tcp missing from NSBonjourServices"; exit 1; }

          mv target/${{ matrix.target }}/minimal/coincube Tenshu.app/Contents/MacOS/Coincube
          mv contrib/release/macos/Coincube.icns Tenshu.app/Contents/Resources/Coincube.icns

          # keychain-access-groups is a *restricted* entitlement: AMFI validates
          # it against an embedded provisioning profile at exec time. Without
          # one the kernel refuses to launch the binary at all — no window, no
          # message, just SIGKILL, while codesign, spctl and notarization all
          # still pass. Determined empirically 2026-08-04; see
          # docs/MACOS_KEYCHAIN_ENTITLEMENT.md §4. The profile is sealed by the
          # signature, so it has to be in place before the signing step.
          cp contrib/release/macos/embedded.provisionprofile Tenshu.app/Contents/embedded.provisionprofile

      # rcodesign's XML parser accepts things Apple's AMFI parser rejects —
      # most easily a double hyphen inside a comment, which XML forbids. CI
      # would sign happily while `codesign` refuses the identical file, so the
      # breakage lands on whoever next signs locally, reported as a syntax
      # error on a comment line. Ad-hoc signing parses the entitlements
      # through AMFI and needs no signing identity.
      - name: Check entitlements parse under Apple's parser
        if: matrix.platform == 'macos'
        run: |
          cp /usr/bin/true entitlements-parse-check
          codesign -f -s - --entitlements contrib/release/macos/coincube.entitlements entitlements-parse-check
          rm -f entitlements-parse-check

      - name: Sign macOS app
        if: matrix.platform == 'macos'
        # --entitlements-xml-path: the local LAN signer (phone_signer
        # module) needs com.apple.security.network.client under the
        # hardened runtime to dial paired phones over TLS. Without
        # this flag, signed/notarized builds get the hardened runtime
        # with no network entitlements and the feature breaks at
        # runtime. See contrib/release/macos/README.md and
        # contrib/release/macos/coincube.entitlements.
        run: rcodesign sign --for-notarization --entitlements-xml-path contrib/release/macos/coincube.entitlements --p12-file cert.p12 --p12-password-file cert.pass Tenshu.app

      # The pipeline otherwise only proves the app is signed and notarized,
      # not that the signature carries what the app needs. Without
      # keychain-access-groups the device secret can't be written and Cube
      # creation fails on every user's machine with -34018. Runs before
      # notarization so a bad signature fails in seconds, not 30 minutes.
      - name: Verify signature, entitlement and provisioning profile
        if: matrix.platform == 'macos'
        run: |
          entitlements=$(codesign -d --entitlements - Tenshu.app 2>&1)
          echo "$entitlements"
          echo "$entitlements" | grep -q 'keychain-access-groups' \
            || { echo "entitlement missing from signature"; exit 1; }
          echo "$entitlements" | grep -q '8UVR249AD5.io.coincube.tenshu' \
            || { echo "keychain access group is not 8UVR249AD5.io.coincube.tenshu"; exit 1; }

          # The entitlement is worse than useless without a profile authorising
          # it — the app won't launch. An expired profile fails identically, and
          # neither failure is visible at sign, notarize or spctl time, so it
          # has to be checked here or discovered by a user.
          profile=Tenshu.app/Contents/embedded.provisionprofile
          test -f "$profile" || { echo "provisioning profile missing from bundle"; exit 1; }
          security cms -D -i "$profile" > profile.plist 2>/dev/null
          plutil -extract Entitlements.keychain-access-groups.0 raw -o - profile.plist \
            | grep -q '^8UVR249AD5' \
            || { echo "profile does not grant the 8UVR249AD5 keychain access group"; exit 1; }
          expiry=$(plutil -extract ExpirationDate raw -o - profile.plist)
          days=$(( ( $(date -j -f "%Y-%m-%dT%H:%M:%SZ" "$expiry" +%s) - $(date +%s) ) / 86400 ))
          echo "provisioning profile valid for $days more days (expires $expiry)"
          [ "$days" -gt 0 ] || { echo "the embedded provisioning profile has expired"; exit 1; }
          rm -f profile.plist

      - name: Notarize and staple app
        if: matrix.platform == 'macos'
        run: |
          base64 -D <<< "${{ secrets.APPSTORECONNECT_KEY_JSON }}" > key.json
          rcodesign notary-submit --api-key-path key.json --max-wait-seconds 1800 --staple Tenshu.app
          spctl --assess --type execute --verbose Tenshu.app

      - name: Create DMG
        if: matrix.platform == 'macos'
        run: |
          create-dmg \
            --volname "Tenshu" \
            --window-size 600 400 \
            --icon-size 128 \
            --icon "Tenshu.app" 175 120 \
            --app-drop-link 425 120 \
            "tenshu-${{ env.COINCUBE_VERSION }}-${{ matrix.target }}.dmg" \
            Tenshu.app

      - name: Upload macOS DMG
        if: matrix.platform == 'macos'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: tenshu-${{ env.COINCUBE_VERSION }}-${{ matrix.target }}.dmg
          tag: ${{ github.ref }}
          overwrite: true

      - name: Cleanup secrets
        if: matrix.platform == 'macos' && always()
        run: |
          rm -f cert.p12 cert.pass key.json

  checksums:
    name: Generate & Sign Checksums
    needs: release
    runs-on: ubuntu-latest
    if: github.repository == 'coincubetech/coincube'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set Coincube version from Cargo
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="coincube-gui") | .version')
          echo "COINCUBE_VERSION=$version" >> $GITHUB_ENV

      - name: Download release artifacts
        uses: robinraju/release-downloader@v1
        with:
          tag: ${{ github.ref_name }}
          fileName: "*"
          out-file-path: "artifacts"

      - name: Generate checksums file
        run: |
          cd artifacts
          # Exclude checksum and signature files from being checksummed
          find . -type f ! -name '*SHA256SUMS*' ! -name '*.asc' ! -name '*.sig' -exec sha256sum {} \; | sed 's|\./||' > ../SHA256SUMS-${{ env.COINCUBE_VERSION }}.txt
          cd ..

      - name: Import GPG signing key
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "use-agent" >> ~/.gnupg/gpg.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Sign checksums file
        run: |
          gpg --batch --yes \
            --pinentry-mode loopback \
            --passphrase "${GPG_PASSPHRASE}" \
            --detach-sign --armor \
            SHA256SUMS-${{ env.COINCUBE_VERSION }}.txt
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Upload checksums and signature
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: SHA256SUMS-${{ env.COINCUBE_VERSION }}.txt*
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
