name: Coincube Release Workflow

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*.*"
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_LTO: true
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
  BREEZ_API_KEY: ${{ github.event_name == 'push' && secrets.BREEZ_API_KEY || 'DUMMY_BREEZ_API_KEY' }}
  COINCUBE_API_URL: ${{ vars.COINCUBE_API_URL }}
  # Build-time passkey flags. Read via `option_env!`, so they have to reach
  # rustc through the process environment — `.env` is gitignored and does not
  # exist on a runner, so `coincube-gui/build.rs` forwards nothing here.
  #
  # Workflow-level, not step-level: `env` at this scope merges with the
  # step-level blocks (`PROTOC`, `TMPDIR`), so the macOS build step inherits
  # both without touching them.
  #
  # These must be **repo-level** Actions variables. Mapped under an Environment
  # instead, a job with no `environment:` key cannot see them, `${{ vars.X }}`
  # expands to the empty string, and the runner exports the variable anyway —
  # which `option_env!` reports as `Some("")`, not `None`. The `const _: () =
  # assert!` in `coincube-gui/src/feature_flags.rs` fails the build in that
  # case rather than shipping a binary whose RP id never matches the AASA.
  COINCUBE_ENABLE_PASSKEY: ${{ vars.COINCUBE_ENABLE_PASSKEY }}
  COINCUBE_PASSKEY_RP_ID: ${{ vars.COINCUBE_PASSKEY_RP_ID }}

jobs:
  release:
    name: Build & Stage
    # Manual dispatch is allowed for a tag, but a branch build must never
    # publish assets without the tag-bound verification jobs below.
    if: github.repository == 'coincubetech/coincube' && startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    # LTO release build + codesign/notarize; a healthy leg is well under this.
    timeout-minutes: 150

    strategy:
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux

          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows

          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64

          # macOS Intel: run the signed artifacts natively before publishing.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Two LTO'd minimal-profile builds now share this runner (the gui and the
      # Spark bridge, which has its own target dir), on top of the restored
      # target/ cache. nightly.yml already had to reclaim this space for one of
      # them; ubuntu-latest's ~14 GB does not stretch to two. Linux only — the
      # macOS and Windows runners have headroom and lack these paths.
      - name: Free disk space (Linux)
        if: matrix.platform == 'linux'
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          echo "After:"; df -h /

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install common tooling
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-wix,apple-codesign,jaq

      - name: Set Coincube version from Cargo
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jaq -r '.packages[] | select(.name=="coincube-gui") | .version')
          echo "COINCUBE_VERSION=$version" >> $GITHUB_ENV

      - name: Require release tag to match app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v$COINCUBE_VERSION" \
            || { echo "release tag $GITHUB_REF_NAME does not match Cargo version $COINCUBE_VERSION"; exit 1; }

      # The Spark bridge is a separate workspace with a separate lock and a
      # separate target dir, and its dep graph (breez-sdk-spark, alloy) is
      # expensive to build from scratch. Cache it alongside the root
      # one, and key on both locks so a change to either invalidates.
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'coincube-spark-bridge/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
          path: |
            target
            coincube-spark-bridge/target

      - name: Generate Icons for Installers
        if: matrix.platform != 'linux'
        run: |
          pip install pillow icnsutil
          python contrib/release/macos/icns-creator.py

      # --------------------------------------------------
      # Linux
      # --------------------------------------------------

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config protobuf-compiler libdbus-1-dev libwebkit2gtk-4.1-dev

      # upload-rust-binary-action built and uploaded exactly one binary and has
      # no way to carry a second, so the Spark bridge could never have ridden
      # along with it. Hand-rolled build + archive + upload instead. The asset
      # name follows the release pattern (coincube-desktop-<version>-<target>.tar.gz — see
      # docs/security/VERIFY.md); what changes is that the tarball now has a
      # leading directory holding both binaries.
      - name: Build Linux binaries
        if: matrix.platform == 'linux'
        run: |
          cargo build --package coincube-gui --bin coincube --profile minimal --target ${{ matrix.target }} --locked
          cargo build --package coincube-mcp --features adapter --profile minimal --target ${{ matrix.target }} --locked
          # The bridge is excluded from the root workspace, so the line above
          # cannot build it — this is the second half of `make build`.
          cargo build --manifest-path coincube-spark-bridge/Cargo.toml --profile minimal --target ${{ matrix.target }} --locked

      # Both binaries ship inside one archive, in one directory. Two loose
      # assets would let a user extract them to different places and reproduce
      # the "Spark is not configured" bug this packaging fixes — the gui only
      # finds the bridge as a sibling of its own executable.
      - name: Package Linux archive
        if: matrix.platform == 'linux'
        run: |
          stage=coincube-desktop-${{ env.COINCUBE_VERSION }}-${{ matrix.target }}
          mkdir -p "$stage"
          cp target/${{ matrix.target }}/minimal/coincube "$stage/"
          cp target/${{ matrix.target }}/minimal/coincube-mcp "$stage/"
          cp coincube-spark-bridge/target/${{ matrix.target }}/minimal/coincube-spark-bridge "$stage/"
          cp LICENCE README.md "$stage/"
          tar czf "$stage.tar.gz" "$stage"

          tar tzf "$stage.tar.gz" | grep -q "^$stage/coincube-spark-bridge$" \
            || { echo "coincube-spark-bridge missing from $stage.tar.gz"; tar tzf "$stage.tar.gz"; exit 1; }

          # It execs and answers on the protocol — no API key, no mnemonic and
          # no network; stdin EOF ends the run.
          out=$(echo '{"type":"request","id":1,"method":"shutdown"}' \
            | "./$stage/coincube-spark-bridge" 2> bridge-stderr.txt) \
            || { echo "bridge failed to run:"; cat bridge-stderr.txt; exit 1; }
          echo "$out"
          echo "$out" | grep -q '"kind":"shutdown"' \
            || { echo "bridge did not answer the shutdown handshake"; cat bridge-stderr.txt; exit 1; }
          rm -f bridge-stderr.txt

      - name: Stage Linux archive
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: coincube-desktop-${{ env.COINCUBE_VERSION }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          compression-level: 0

      # --------------------------------------------------
      # Windows
      # --------------------------------------------------

      - name: Install Windows dependencies
        if: matrix.platform == 'windows'
        uses: ./.github/actions/install-protoc-windows

      - name: Build Windows MSI
        if: matrix.platform == 'windows'
        run: |
          cargo build --package coincube-gui --profile minimal --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --package coincube-mcp --features adapter --profile minimal --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python contrib/check_windows_binary.py target/minimal/coincube.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The bridge is excluded from the root workspace, so the line above
          # cannot build it — this is the second half of `make build`.
          cargo build --manifest-path coincube-spark-bridge/Cargo.toml --profile minimal --locked
          # `cargo wix --no-build` only packages files that already exist, and
          # main.wxs sources both binaries from $(var.CargoTargetBinDir)
          # (target\minimal). The bridge builds into its own workspace's target
          # dir, so copy it across before wix looks for it.
          Copy-Item coincube-spark-bridge\target\minimal\coincube-spark-bridge.exe target\minimal\
          cargo wix --package coincube-gui --no-build --profile minimal --output "target/wix/coincube-desktop-${{ env.COINCUBE_VERSION }}-${{ matrix.target }}.msi" --include ./contrib/release/wix/main.wxs --nocapture -v

      # A string grep of the .msi proves nothing — the payload is in a
      # compressed cab. An administrative install unpacks the real file table,
      # which is also the only way to check the installed *layout*: the gui
      # looks for the bridge next to its own executable, so a bridge in a
      # different directory reproduces the bug the MSI change exists to fix.
      - name: Verify Spark bridge is in the MSI
        if: matrix.platform == 'windows'
        run: |
          $msi = (Resolve-Path "target/wix/coincube-desktop-${{ env.COINCUBE_VERSION }}-${{ matrix.target }}.msi").Path
          $dest = Join-Path $env:RUNNER_TEMP "msi-contents"
          Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
          $p = Start-Process msiexec -ArgumentList @('/a', "`"$msi`"", '/qn', "TARGETDIR=`"$dest`"") -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { Write-Host "msiexec administrative install failed: $($p.ExitCode)"; exit 1 }

          $gui = Get-ChildItem -Path $dest -Recurse -Filter coincube.exe | Select-Object -First 1
          if (-not $gui) { Write-Host "coincube.exe missing from the MSI"; exit 1 }
          $bridge = Get-ChildItem -Path $dest -Recurse -Filter coincube-spark-bridge.exe | Select-Object -First 1
          if (-not $bridge) { Write-Host "coincube-spark-bridge.exe missing from the MSI"; exit 1 }
          if ($bridge.DirectoryName -ne $gui.DirectoryName) {
            Write-Host "bridge installs to $($bridge.DirectoryName) but the gui installs to $($gui.DirectoryName) — they must be siblings"
            exit 1
          }
          $mcp = Get-ChildItem -Path $dest -Recurse -Filter coincube-mcp.exe | Select-Object -First 1
          if (-not $mcp -or $mcp.DirectoryName -ne $gui.DirectoryName) {
            Write-Host "coincube-mcp.exe must install beside coincube.exe"; exit 1
          }
          # Run the actual extracted companion against the tested named-pipe fixture.
          $env:COINCUBE_MCP_TEST_ADAPTER = $mcp.FullName
          cargo test -p coincube-mcp --features adapter --locked extracted_adapter_stdio -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:COINCUBE_MCP_TEST_ADAPTER
          Write-Host "all companion binaries install to $($gui.DirectoryName)"

          # It execs and speaks the protocol. No API key, no mnemonic, no
          # network: stdin EOF ends the run on its own.
          $out = '{"type":"request","id":1,"method":"shutdown"}' | & $bridge.FullName
          if ($LASTEXITCODE -ne 0) { Write-Host "bridge exited with $LASTEXITCODE"; exit 1 }
          Write-Host $out
          if ($out -notmatch '"kind":"shutdown"') { Write-Host "bridge did not answer the shutdown handshake"; exit 1 }

      - name: Stage Windows MSI
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: target/wix/coincube-desktop-${{ env.COINCUBE_VERSION }}-${{ matrix.target }}.msi
          if-no-files-found: error
          compression-level: 0

      # --------------------------------------------------
      # macOS (arm64 + x64)
      # --------------------------------------------------

      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        run: brew install protobuf create-dmg

      - name: Prepare Apple Developer ID certificate
        if: matrix.platform == 'macos'
        env:
          P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.CERTIFICATE_P12_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > cert.p12
          echo "$P12_PASSWORD" > cert.pass

      - name: Build Coincube (macOS ${{ matrix.arch }})
        if: matrix.platform == 'macos'
        run: |
          rustup target add ${{ matrix.target }}
          export PROTOC="$(brew --prefix)/bin/protoc"
          cargo build --package coincube-gui --profile minimal --target ${{ matrix.target }} --locked
          cargo build --package coincube-mcp --features adapter --profile minimal --target ${{ matrix.target }} --locked
          # The bridge is deliberately excluded from the root workspace, so the
          # line above cannot build it — this is the second half of the
          # Makefile's `build: bridge gui`. Omit it and the bundle ships with no
          # Spark bridge, and every Spark panel renders "not configured".
          cargo build --manifest-path coincube-spark-bridge/Cargo.toml --profile minimal --target ${{ matrix.target }} --locked

      - name: Assemble .app bundle
        if: matrix.platform == 'macos'
        run: |
          unzip contrib/release/macos/_coincube.zip
          sed -i '' "s/VERSION_PLACEHOLDER/${{ env.COINCUBE_VERSION }}/g" COINCUBE.app/Contents/Info.plist

          # Guard the checked-in bundle template before anything is copied
          # into it. A wrong CFBundleIdentifier desyncs the keychain access
          # group in coincube.entitlements (<TeamID>.<bundleID>) and strands
          # device secrets; missing Bonjour keys break the LAN signer only
          # once the build is on a user's machine.
          plist=COINCUBE.app/Contents/Info.plist
          bundle_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$plist")
          [ "$bundle_id" = "io.coincube.desktop" ] \
            || { echo "unexpected CFBundleIdentifier: $bundle_id"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :NSLocalNetworkUsageDescription" "$plist" > /dev/null \
            || { echo "NSLocalNetworkUsageDescription missing from Info.plist"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :NSBonjourServices:0" "$plist" | grep -qx '_coincube-signer._tcp' \
            || { echo "_coincube-signer._tcp missing from NSBonjourServices"; exit 1; }

          mv target/${{ matrix.target }}/minimal/coincube COINCUBE.app/Contents/MacOS/Coincube
          mv target/${{ matrix.target }}/minimal/coincube-mcp COINCUBE.app/Contents/MacOS/coincube-mcp
          mv contrib/release/macos/Coincube.icns COINCUBE.app/Contents/Resources/Coincube.icns

          # The gui resolves the Spark bridge as a sibling of its own
          # executable, under that literal filename — see resolve_bridge_path()
          # in coincube-gui/src/app/breez_spark/client.rs. So: Contents/MacOS/
          # and nowhere else (Resources/ or Frameworks/ silently reproduces the
          # "Spark is not configured" bug), and NOT renamed the way the main
          # binary is renamed to Coincube. Like the provisioning profile below,
          # it has to be in place before signing: notarization rejects unsigned
          # nested Mach-O, and adding one afterwards breaks the seal.
          mv coincube-spark-bridge/target/${{ matrix.target }}/minimal/coincube-spark-bridge \
             COINCUBE.app/Contents/MacOS/coincube-spark-bridge

          # keychain-access-groups is a *restricted* entitlement: AMFI validates
          # it against an embedded provisioning profile at exec time. Without
          # one the kernel refuses to launch the binary at all — no window, no
          # message, just SIGKILL, while codesign, spctl and notarization all
          # still pass. Determined empirically 2026-08-04; see
          # docs/MACOS_KEYCHAIN_ENTITLEMENT.md §4. The profile is sealed by the
          # signature, so it has to be in place before the signing step.
          cp contrib/release/macos/embedded.provisionprofile COINCUBE.app/Contents/embedded.provisionprofile

      # rcodesign's XML parser accepts things Apple's AMFI parser rejects —
      # most easily a double hyphen inside a comment, which XML forbids. CI
      # would sign happily while `codesign` refuses the identical file, so the
      # breakage lands on whoever next signs locally, reported as a syntax
      # error on a comment line. Ad-hoc signing parses the entitlements
      # through AMFI and needs no signing identity.
      - name: Check entitlements parse under Apple's parser
        if: matrix.platform == 'macos'
        run: |
          cp /usr/bin/true entitlements-parse-check
          codesign -f -s - --entitlements contrib/release/macos/coincube.entitlements entitlements-parse-check
          rm -f entitlements-parse-check

      - name: Sign macOS app
        if: matrix.platform == 'macos'
        # --entitlements-xml-path: the local LAN signer (phone_signer
        # module) needs com.apple.security.network.client under the
        # hardened runtime to dial paired phones over TLS. Without
        # this flag, signed/notarized builds get the hardened runtime
        # with no network entitlements and the feature breaks at
        # runtime. See contrib/release/macos/README.md and
        # contrib/release/macos/coincube.entitlements.
        run: rcodesign sign --for-notarization --entitlements-xml-path contrib/release/macos/coincube.entitlements --p12-file cert.p12 --p12-password-file cert.pass COINCUBE.app

      # The pipeline otherwise only proves the app is signed and notarized,
      # not that the signature carries what the app needs. Without
      # keychain-access-groups the device secret can't be written and Cube
      # creation fails on every user's machine with -34018. Runs before
      # notarization so a bad signature fails in seconds, not 30 minutes.
      - name: Verify signature, entitlement and provisioning profile
        if: matrix.platform == 'macos'
        run: |
          entitlements=$(codesign -d --entitlements - COINCUBE.app 2>&1)
          echo "$entitlements"
          echo "$entitlements" | grep -q 'keychain-access-groups' \
            || { echo "entitlement missing from signature"; exit 1; }
          echo "$entitlements" | grep -q '8UVR249AD5.io.coincube.desktop' \
            || { echo "keychain access group is not 8UVR249AD5.io.coincube.desktop"; exit 1; }

          # The entitlement whose absence shipped a dead passkey path in every
          # artifact up to 2026-08-07. AuthenticationServices refuses WebAuthn to
          # a process carrying no application identifier and fails every ceremony
          # with ASAuthorizationError 1004 — while codesign, notarization and
          # spctl all pass, so nothing upstream of a user notices. The embedded
          # profile has always GRANTED the key, but a grant is not a request: it
          # has to be in coincube.entitlements to reach the signature.
          #
          # Asserted by key rather than by grep, because keychain-access-groups
          # and com.apple.application-identifier carry the SAME value here — a
          # substring match over the whole blob cannot tell which key it found,
          # which also means the grep above is satisfied by either one.
          codesign -d --entitlements - --xml COINCUBE.app 2>/dev/null > entitlements.plist
          appid=$(/usr/libexec/PlistBuddy -c "Print :com.apple.application-identifier" entitlements.plist 2>/dev/null) \
            || { echo "com.apple.application-identifier missing from the signature — every passkey ceremony would fail with ASAuthorizationError 1004"; exit 1; }
          [ "$appid" = "8UVR249AD5.io.coincube.desktop" ] \
            || { echo "com.apple.application-identifier is '$appid', expected 8UVR249AD5.io.coincube.desktop — unlike the wildcard-granted entitlements this must match the profile exactly"; exit 1; }
          echo "com.apple.application-identifier = $appid"

          # With the value above pinned by key, pin the access group the same way
          # so the grep further up cannot be satisfied by the app identifier alone.
          group=$(/usr/libexec/PlistBuddy -c "Print :keychain-access-groups:0" entitlements.plist 2>/dev/null) \
            || { echo "keychain-access-groups missing from the signature"; exit 1; }
          [ "$group" = "8UVR249AD5.io.coincube.desktop" ] \
            || { echo "keychain access group is '$group', expected 8UVR249AD5.io.coincube.desktop"; exit 1; }
          echo "keychain-access-groups = $group"

          # The legacy Tenshu group must stay listed second: Tenshu-era builds
          # (io.coincube.tenshu) stored device secrets there, and without it
          # those Cubes can't be opened on this machine. New items still go to
          # the first group.
          legacy=$(/usr/libexec/PlistBuddy -c "Print :keychain-access-groups:1" entitlements.plist 2>/dev/null) \
            || { echo "legacy keychain access group missing from the signature"; exit 1; }
          [ "$legacy" = "8UVR249AD5.io.coincube.tenshu" ] \
            || { echo "second keychain access group is '$legacy', expected 8UVR249AD5.io.coincube.tenshu"; exit 1; }
          echo "legacy keychain-access-group = $legacy"

          # Team identity, granted by the profile alongside the application
          # identifier. Also restricted, so a value the profile does not grant is
          # an AMFI rejection at exec — SIGKILL on every user's machine with
          # codesign, spctl and notarization all green
          # (docs/MACOS_KEYCHAIN_ENTITLEMENT.md), not a graceful failure. Pinned
          # by key for the same reason as the two above.
          team=$(/usr/libexec/PlistBuddy -c "Print :com.apple.developer.team-identifier" entitlements.plist 2>/dev/null) \
            || { echo "com.apple.developer.team-identifier missing from the signature"; exit 1; }
          [ "$team" = "8UVR249AD5" ] \
            || { echo "com.apple.developer.team-identifier is '$team', expected 8UVR249AD5 — it must match what the embedded profile grants"; exit 1; }
          echo "com.apple.developer.team-identifier = $team"
          rm -f entitlements.plist

          # The entitlement is worse than useless without a profile authorising
          # it — the app won't launch. An expired profile fails identically, and
          # neither failure is visible at sign, notarize or spctl time, so it
          # has to be checked here or discovered by a user.
          profile=COINCUBE.app/Contents/embedded.provisionprofile
          test -f "$profile" || { echo "provisioning profile missing from bundle"; exit 1; }
          security cms -D -i "$profile" > profile.plist 2>/dev/null
          plutil -extract Entitlements.keychain-access-groups.0 raw -o - profile.plist \
            | grep -q '^8UVR249AD5' \
            || { echo "profile does not grant the 8UVR249AD5 keychain access group"; exit 1; }
          # Unlike the keychain group (granted as the team wildcard), the
          # application identifier is granted EXACTLY, so a profile issued for
          # another App ID (the Tenshu-era one, say) passes the check above yet
          # cannot authorise this signature: AMFI SIGKILLs the app at launch.
          profile_appid=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.application-identifier" profile.plist 2>/dev/null) \
            || { echo "profile grants no com.apple.application-identifier"; exit 1; }
          [ "$profile_appid" = "8UVR249AD5.io.coincube.desktop" ] \
            || { echo "profile grants application-identifier '$profile_appid', expected 8UVR249AD5.io.coincube.desktop — regenerate it for this App ID"; exit 1; }
          echo "profile grants com.apple.application-identifier = $profile_appid"
          expiry=$(plutil -extract ExpirationDate raw -o - profile.plist)
          days=$(( ( $(date -j -f "%Y-%m-%dT%H:%M:%SZ" "$expiry" +%s) - $(date +%s) ) / 86400 ))
          echo "provisioning profile valid for $days more days (expires $expiry)"
          [ "$days" -gt 0 ] || { echo "the embedded provisioning profile has expired"; exit 1; }
          rm -f profile.plist

          # A profile authorises specific CERTIFICATES, not just an App ID, so
          # signing with a different Developer ID cert for the same team — a
          # rotated one, or an older p12 still in the signing secret — is
          # rejected by AMFI at exec. Nothing above catches it: the common names
          # are identical, codesign and spctl pass, and notarization succeeds.
          # The app is simply SIGKILLed on every user's machine.
          # Read the certificate back out of the finished signature rather than
          # out of the p12: that is what AMFI will judge, and it needs no secret.
          contrib/release/macos/check-profile-authorises-cert.sh \
            "$profile" --signed-bundle COINCUBE.app

      # Every artifact built between 2026-04-15 and 2026-08-06 shipped without
      # the Spark bridge, and nothing in this pipeline noticed: codesign,
      # notarization and spctl all pass on a bundle with no Spark in it. Only an
      # explicit contents assertion catches it, so this step is the whole point
      # of bundling the bridge — without it the next workflow edit can drop the
      # binary again and ship green. Runs before notarization so a bad bundle
      # fails in seconds rather than half an hour.
      - name: Verify Spark bridge is bundled, correct arch, signed and runnable
        if: matrix.platform == 'macos'
        run: |
          bridge=COINCUBE.app/Contents/MacOS/coincube-spark-bridge
          test -x COINCUBE.app/Contents/MacOS/coincube-mcp
          codesign --verify --strict COINCUBE.app/Contents/MacOS/coincube-mcp
          python3 contrib/check_mcp_binary.py COINCUBE.app/Contents/MacOS/coincube-mcp

          # (1) Present at all — the failure this exists to catch.
          test -f "$bridge" \
            || { echo "coincube-spark-bridge missing from COINCUBE.app/Contents/MacOS"; exit 1; }

          # (2) Built for this leg's architecture. A wrong-arch bridge is still
          #     found by resolve_bridge_path() — it just dies on exec, which
          #     surfaces to the user as the same "not configured" message.
          case "${{ matrix.target }}" in
            aarch64-*) want=arm64 ;;
            x86_64-*)  want=x86_64 ;;
            *) echo "unhandled target ${{ matrix.target }}"; exit 1 ;;
          esac
          archs=$(lipo -archs "$bridge")
          echo "bridge architectures: $archs"
          echo "$archs" | tr ' ' '\n' | grep -qx "$want" \
            || { echo "bridge is [$archs], expected $want for ${{ matrix.target }}"; exit 1; }

          # (3) Covered by the bundle signature. Also the empirical answer to
          #     "does rcodesign --for-notarization sign a second Mach-O in
          #     Contents/MacOS?" — if this fails, the bridge needs its own
          #     rcodesign pass before the bundle is signed.
          codesign --verify --strict --verbose=2 "$bridge" \
            || { echo "bridge is not covered by the bundle signature"; exit 1; }

          # (4) It actually runs. Presence proves nothing about exec: the
          #     keychain-entitlement failure class is a SIGKILL at launch with
          #     every signing check green (docs/MACOS_KEYCHAIN_ENTITLEMENT.md).
          #     A shutdown round trip exercises exec, the hardened runtime, the
          #     tokio runtime and the JSON-RPC loop, and needs no API key, no
          #     mnemonic and no network — unlike --smoke-test, which requires
          #     COINCUBE_SPARK_MNEMONIC and transacts against Spark mainnet.
          #     Both release legs run on their native architecture.
          if [ "$want" = "$(uname -m)" ]; then
            out=$(echo '{"type":"request","id":1,"method":"shutdown"}' \
              | "$bridge" 2> bridge-stderr.txt) \
              || { echo "bridge failed to run:"; cat bridge-stderr.txt; exit 1; }
            echo "$out"
            echo "$out" | grep -q '"kind":"shutdown"' \
              || { echo "bridge did not answer the shutdown handshake"; cat bridge-stderr.txt; exit 1; }
            rm -f bridge-stderr.txt
          else
            echo "skipping the run check: ${{ matrix.target }} cannot exec on $(uname -m)"
          fi

      - name: Notarize and staple app
        if: matrix.platform == 'macos'
        run: |
          base64 -D <<< "${{ secrets.APPSTORECONNECT_KEY_JSON }}" > key.json
          rcodesign notary-submit --api-key-path key.json --max-wait-seconds 1800 --staple COINCUBE.app
          spctl --assess --type execute --verbose COINCUBE.app

      - name: Create DMG
        if: matrix.platform == 'macos'
        run: |
          create-dmg \
            --volname "COINCUBE" \
            --window-size 600 400 \
            --icon-size 128 \
            --icon "COINCUBE.app" 175 120 \
            --app-drop-link 425 120 \
            "coincube-desktop-${{ env.COINCUBE_VERSION }}-${{ matrix.target }}.dmg" \
            COINCUBE.app

      - name: Stage macOS DMG
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: coincube-desktop-${{ env.COINCUBE_VERSION }}-${{ matrix.target }}.dmg
          if-no-files-found: error
          compression-level: 0

      - name: Cleanup secrets
        if: matrix.platform == 'macos' && always()
        run: |
          rm -f cert.p12 cert.pass key.json

  checksums:
    name: Generate & Sign Checksums
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'coincubetech/coincube' && startsWith(github.ref, 'refs/tags/')
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set Coincube version from Cargo
        id: version
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="coincube-gui") | .version')
          echo "COINCUBE_VERSION=$version" >> $GITHUB_ENV
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Download staged platform artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Generate checksums file
        run: |
          cd artifacts
          find . -maxdepth 1 -type f -name 'coincube-desktop-*' -printf '%f\0' | sort -z | xargs -0 -r sha256sum > SHA256SUMS-${{ env.COINCUBE_VERSION }}.txt
          cd ..

      - name: Import GPG signing key
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "use-agent" >> ~/.gnupg/gpg.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Sign checksums file
        run: |
          gpg --batch --yes \
            --pinentry-mode loopback \
            --passphrase "${GPG_PASSPHRASE}" \
            --detach-sign --armor \
            artifacts/SHA256SUMS-${{ env.COINCUBE_VERSION }}.txt
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Verify complete staged bundle
        run: python3 contrib/release/verify-release-assets.py artifacts "$COINCUBE_VERSION"

      - name: Stage signed release bundle
        uses: actions/upload-artifact@v6
        with:
          name: signed-release-bundle
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0

  publish_release:
    name: Verify draft and publish complete release
    needs: checksums
    if: github.repository == 'coincubetech/coincube' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download signed release bundle
        uses: actions/download-artifact@v6
        with:
          name: signed-release-bundle
          path: artifacts
      - name: Verify signature and complete bundle before upload
        env:
          RELEASE_VERSION: ${{ needs.checksums.outputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v$RELEASE_VERSION"
          expected_fingerprint=ED4D0D710103D6252854681367F9701BF0D2DAF4
          actual_fingerprint=$(gpg --batch --show-keys --with-colons docs/security/coincube-release-public.asc \
            | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$actual_fingerprint" = "$expected_fingerprint"
          export GNUPGHOME="$RUNNER_TEMP/coincube-release-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --import docs/security/coincube-release-public.asc
          gpg --batch --verify "artifacts/SHA256SUMS-${RELEASE_VERSION}.txt.asc" "artifacts/SHA256SUMS-${RELEASE_VERSION}.txt"
          python3 contrib/release/verify-release-assets.py artifacts "$RELEASE_VERSION"
      - name: Create draft release with complete bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.checksums.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --title "Coincube v$RELEASE_VERSION" \
            --notes "Installers for Windows, macOS and Linux"
      - name: Verify assets downloaded from draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.checksums.outputs.version }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir draft-assets
          gpg --batch --homedir "$RUNNER_TEMP/coincube-release-gnupg" --verify \
            "draft-assets/SHA256SUMS-${RELEASE_VERSION}.txt.asc" \
            "draft-assets/SHA256SUMS-${RELEASE_VERSION}.txt"
          python3 contrib/release/verify-release-assets.py draft-assets "$RELEASE_VERSION"
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  verify_release:
    name: Verify published release signature and assets
    needs: [checksums, publish_release]
    if: github.repository == 'coincubetech/coincube' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir artifacts
      - name: Verify GPG signature and every artifact checksum
        env:
          RELEASE_VERSION: ${{ needs.checksums.outputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v$RELEASE_VERSION" \
            || { echo "release tag $GITHUB_REF_NAME does not match Cargo version $RELEASE_VERSION"; exit 1; }
          expected_fingerprint=ED4D0D710103D6252854681367F9701BF0D2DAF4
          actual_fingerprint=$(gpg --batch --show-keys --with-colons docs/security/coincube-release-public.asc \
            | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$actual_fingerprint" = "$expected_fingerprint"
          export GNUPGHOME="$RUNNER_TEMP/coincube-release-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --import docs/security/coincube-release-public.asc
          gpg --batch --verify \
            "artifacts/SHA256SUMS-${RELEASE_VERSION}.txt.asc" \
            "artifacts/SHA256SUMS-${RELEASE_VERSION}.txt"
          python3 contrib/release/verify-release-assets.py artifacts "$RELEASE_VERSION"
