name: Nightly Build

permissions:
  contents: read

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC nightly (offset from the 06:00 connect-integration nightly)
  workflow_dispatch: # manual "Run workflow" button for on-demand builds

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_LTO: true
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
  BREEZ_API_KEY: ${{ secrets.BREEZ_API_KEY }}
  COINCUBE_API_URL: ${{ vars.COINCUBE_API_URL }}
  # Build-time passkey flags — the same repo-level Actions variables
  # releases.yml reads. They have to be here too, or the nightly DMG is the one
  # artifact people actually install with the passkey path compiled out:
  # `option_env!` sees nothing (`.env` is gitignored and absent on a runner, so
  # `coincube-gui/build.rs` forwards nothing), `PASSKEY_ENABLED` is `false`, and
  # the `const _: () = assert!` in `coincube-gui/src/feature_flags.rs` stays
  # quiet because it only guards the flag being *on*. Nothing downstream
  # notices: codesign, notarization and spctl all pass. This is how every
  # nightly between 32e0033a and 2026-08-07 shipped without Passkey.
  COINCUBE_ENABLE_PASSKEY: ${{ vars.COINCUBE_ENABLE_PASSKEY }}
  COINCUBE_PASSKEY_RP_ID: ${{ vars.COINCUBE_PASSKEY_RP_ID }}

jobs:
  # Gate the build: a scheduled nightly is skipped when master has not changed
  # in the last 24h. A manual workflow_dispatch always builds regardless.
  check:
    name: Check for new commits
    runs-on: ubuntu-latest
    if: github.repository == 'coincubetech/coincube'
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"          # manual run always builds
          elif [ -n "$(git rev-list --after='24 hours' --max-count=1 ${{ github.sha }})" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"          # HEAD committed within last 24h
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"         # nothing new — skip
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux

          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows

          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64

          # macOS Intel
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The minimal-profile GUI build enables LTO (see env above), which spills
      # large LLVM intermediates to disk; together with the restored target/
      # cache this exhausts ubuntu-latest's ~14 GB of free space
      # ("No space left on device"). Reclaim the big preinstalled toolchains we
      # don't use, before the cache restore and build. Linux only — the macOS
      # and Windows runners have more headroom and lack these paths.
      - name: Free disk space (Linux)
        if: matrix.platform == 'linux'
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          echo "After:"; df -h /

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install common tooling
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-wix,apple-codesign,jaq

      - name: Set Coincube version from Cargo
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jaq -r '.packages[] | select(.name=="coincube-gui") | .version')
          echo "COINCUBE_VERSION=$version" >> $GITHUB_ENV

      - name: Set build tag
        shell: bash
        run: echo "BUILD_TAG=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> $GITHUB_ENV

      # The Spark bridge is a separate workspace with a separate lock and a
      # separate target dir, and its dep graph (breez-sdk-spark, boltz-client,
      # alloy) is expensive to build from scratch. Cache it alongside the root
      # one, and key on both locks so a change to either invalidates.
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'coincube-spark-bridge/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
          path: |
            target
            coincube-spark-bridge/target

      - name: Generate Icons for Installers
        if: matrix.platform != 'linux'
        run: |
          pip install pillow icnsutil
          python contrib/release/macos/icns-creator.py

      # --------------------------------------------------
      # Linux
      # --------------------------------------------------

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config protobuf-compiler libdbus-1-dev libwebkit2gtk-4.1-dev

      - name: Build Linux binaries
        if: matrix.platform == 'linux'
        run: |
          cargo build --package coincube-gui --bin coincube --profile minimal --target ${{ matrix.target }} --locked
          # The bridge is excluded from the root workspace, so the line above
          # cannot build it — this is the second half of `make build`.
          cargo build --manifest-path coincube-spark-bridge/Cargo.toml --profile minimal --target ${{ matrix.target }} --locked

      # Both binaries ship inside one archive, in one directory. Two loose
      # assets would let a user extract them to different places and reproduce
      # the "Spark is not configured" bug the packaging fixes — the gui only
      # finds the bridge as a sibling of its own executable. The tarball also
      # survives GitHub's artifact zip with its exec bits intact, which a bare
      # uploaded binary does not.
      - name: Package Linux archive
        if: matrix.platform == 'linux'
        run: |
          stage=tenshu-${{ env.COINCUBE_VERSION }}-${{ matrix.target }}
          mkdir -p "$stage"
          cp target/${{ matrix.target }}/minimal/coincube "$stage/"
          cp coincube-spark-bridge/target/${{ matrix.target }}/minimal/coincube-spark-bridge "$stage/"
          cp LICENCE README.md "$stage/"
          tar czf "$stage.tar.gz" "$stage"

          tar tzf "$stage.tar.gz" | grep -q "^$stage/coincube-spark-bridge$" \
            || { echo "coincube-spark-bridge missing from $stage.tar.gz"; tar tzf "$stage.tar.gz"; exit 1; }

          # It execs and answers on the protocol — no API key, no mnemonic and
          # no network; stdin EOF ends the run.
          out=$(echo '{"type":"request","id":1,"method":"shutdown"}' \
            | "./$stage/coincube-spark-bridge" 2> bridge-stderr.txt) \
            || { echo "bridge failed to run:"; cat bridge-stderr.txt; exit 1; }
          echo "$out"
          echo "$out" | grep -q '"kind":"shutdown"' \
            || { echo "bridge did not answer the shutdown handshake"; cat bridge-stderr.txt; exit 1; }
          rm -f bridge-stderr.txt

          echo "STAGE=$stage" >> "$GITHUB_ENV"

      - name: Upload Linux artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v6
        with:
          name: tenshu-nightly-${{ env.BUILD_TAG }}-${{ matrix.target }}
          path: ${{ env.STAGE }}.tar.gz

      # --------------------------------------------------
      # Windows
      # --------------------------------------------------

      - name: Install Windows dependencies
        if: matrix.platform == 'windows'
        run: choco install protoc --yes --no-progress

      - name: Build Windows MSI
        if: matrix.platform == 'windows'
        run: |
          cargo build --package coincube-gui --profile minimal --locked
          # The bridge is excluded from the root workspace, so the line above
          # cannot build it — this is the second half of `make build`.
          cargo build --manifest-path coincube-spark-bridge/Cargo.toml --profile minimal --locked
          # `cargo wix --no-build` only packages files that already exist, and
          # main.wxs sources both binaries from $(var.CargoTargetBinDir)
          # (target\minimal). The bridge builds into its own workspace's target
          # dir, so copy it across before wix looks for it.
          Copy-Item coincube-spark-bridge\target\minimal\coincube-spark-bridge.exe target\minimal\
          cargo wix --package coincube-gui --no-build --profile minimal --output "target/wix/tenshu-${{ env.COINCUBE_VERSION }}-${{ matrix.target }}.msi" --include ./contrib/release/wix/main.wxs --nocapture -v

      # A string grep of the .msi proves nothing — the payload is in a
      # compressed cab. An administrative install unpacks the real file table,
      # which is also the only way to check the installed *layout*: the gui
      # looks for the bridge next to its own executable, so a bridge in a
      # different directory reproduces the bug the MSI change exists to fix.
      - name: Verify Spark bridge is in the MSI
        if: matrix.platform == 'windows'
        run: |
          $msi = (Resolve-Path "target/wix/tenshu-${{ env.COINCUBE_VERSION }}-${{ matrix.target }}.msi").Path
          $dest = Join-Path $env:RUNNER_TEMP "msi-contents"
          Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
          $p = Start-Process msiexec -ArgumentList @('/a', "`"$msi`"", '/qn', "TARGETDIR=`"$dest`"") -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { Write-Host "msiexec administrative install failed: $($p.ExitCode)"; exit 1 }

          $gui = Get-ChildItem -Path $dest -Recurse -Filter coincube.exe | Select-Object -First 1
          if (-not $gui) { Write-Host "coincube.exe missing from the MSI"; exit 1 }
          $bridge = Get-ChildItem -Path $dest -Recurse -Filter coincube-spark-bridge.exe | Select-Object -First 1
          if (-not $bridge) { Write-Host "coincube-spark-bridge.exe missing from the MSI"; exit 1 }
          if ($bridge.DirectoryName -ne $gui.DirectoryName) {
            Write-Host "bridge installs to $($bridge.DirectoryName) but the gui installs to $($gui.DirectoryName) — they must be siblings"
            exit 1
          }
          Write-Host "both binaries install to $($gui.DirectoryName)"

          # It execs and speaks the protocol. No API key, no mnemonic, no
          # network: stdin EOF ends the run on its own.
          $out = '{"type":"request","id":1,"method":"shutdown"}' | & $bridge.FullName
          if ($LASTEXITCODE -ne 0) { Write-Host "bridge exited with $LASTEXITCODE"; exit 1 }
          Write-Host $out
          if ($out -notmatch '"kind":"shutdown"') { Write-Host "bridge did not answer the shutdown handshake"; exit 1 }

      - name: Upload Windows artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v6
        with:
          name: tenshu-nightly-${{ env.BUILD_TAG }}-${{ matrix.target }}
          path: target/wix/tenshu-${{ env.COINCUBE_VERSION }}-${{ matrix.target }}.msi

      # --------------------------------------------------
      # macOS (arm64 + x64)
      # --------------------------------------------------

      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        run: brew install protobuf create-dmg

      - name: Prepare Apple Developer ID certificate
        if: matrix.platform == 'macos'
        env:
          P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.CERTIFICATE_P12_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > cert.p12
          echo "$P12_PASSWORD" > cert.pass

      - name: Build Coincube (macOS ${{ matrix.arch }})
        if: matrix.platform == 'macos'
        env:
          PROTOC: /opt/homebrew/bin/protoc
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --package coincube-gui --profile minimal --target ${{ matrix.target }} --locked
          # The bridge is deliberately excluded from the root workspace, so the
          # line above cannot build it — this is the second half of the
          # Makefile's `build: bridge gui`. Omit it and the bundle ships with no
          # Spark bridge, and every Spark panel renders "not configured".
          cargo build --manifest-path coincube-spark-bridge/Cargo.toml --profile minimal --target ${{ matrix.target }} --locked

      - name: Assemble .app bundle
        if: matrix.platform == 'macos'
        run: |
          unzip contrib/release/macos/_coincube.zip
          sed -i '' "s/VERSION_PLACEHOLDER/${{ env.COINCUBE_VERSION }}/g" Tenshu.app/Contents/Info.plist

          # Guard the checked-in bundle template before anything is copied
          # into it. A wrong CFBundleIdentifier desyncs the keychain access
          # group in coincube.entitlements (<TeamID>.<bundleID>) and strands
          # device secrets; missing Bonjour keys break the LAN signer only
          # once the build is on a user's machine.
          plist=Tenshu.app/Contents/Info.plist
          bundle_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$plist")
          [ "$bundle_id" = "io.coincube.tenshu" ] \
            || { echo "unexpected CFBundleIdentifier: $bundle_id"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :NSLocalNetworkUsageDescription" "$plist" > /dev/null \
            || { echo "NSLocalNetworkUsageDescription missing from Info.plist"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :NSBonjourServices:0" "$plist" | grep -qx '_coincube-signer._tcp' \
            || { echo "_coincube-signer._tcp missing from NSBonjourServices"; exit 1; }

          mv target/${{ matrix.target }}/minimal/coincube Tenshu.app/Contents/MacOS/Coincube
          mv contrib/release/macos/Coincube.icns Tenshu.app/Contents/Resources/Coincube.icns

          # The gui resolves the Spark bridge as a sibling of its own
          # executable, under that literal filename — see resolve_bridge_path()
          # in coincube-gui/src/app/breez_spark/client.rs. So: Contents/MacOS/
          # and nowhere else (Resources/ or Frameworks/ silently reproduces the
          # "Spark is not configured" bug), and NOT renamed the way the main
          # binary is renamed to Coincube. Like the provisioning profile below,
          # it has to be in place before signing: notarization rejects unsigned
          # nested Mach-O, and adding one afterwards breaks the seal.
          mv coincube-spark-bridge/target/${{ matrix.target }}/minimal/coincube-spark-bridge \
             Tenshu.app/Contents/MacOS/coincube-spark-bridge

          # keychain-access-groups is a *restricted* entitlement: AMFI validates
          # it against an embedded provisioning profile at exec time. Without
          # one the kernel refuses to launch the binary at all — no window, no
          # message, just SIGKILL, while codesign, spctl and notarization all
          # still pass. Determined empirically 2026-08-04; see
          # docs/MACOS_KEYCHAIN_ENTITLEMENT.md §4. The profile is sealed by the
          # signature, so it has to be in place before the signing step.
          cp contrib/release/macos/embedded.provisionprofile Tenshu.app/Contents/embedded.provisionprofile

      # rcodesign's XML parser accepts things Apple's AMFI parser rejects —
      # most easily a double hyphen inside a comment, which XML forbids. CI
      # would sign happily while `codesign` refuses the identical file, so the
      # breakage lands on whoever next signs locally, reported as a syntax
      # error on a comment line. Ad-hoc signing parses the entitlements
      # through AMFI and needs no signing identity.
      - name: Check entitlements parse under Apple's parser
        if: matrix.platform == 'macos'
        run: |
          cp /usr/bin/true entitlements-parse-check
          codesign -f -s - --entitlements contrib/release/macos/coincube.entitlements entitlements-parse-check
          rm -f entitlements-parse-check

      - name: Sign macOS app
        if: matrix.platform == 'macos'
        # --entitlements-xml-path: the local LAN signer (phone_signer
        # module) needs com.apple.security.network.client under the
        # hardened runtime to dial paired phones over TLS. Without
        # this flag, signed/notarized builds get the hardened runtime
        # with no network entitlements and the feature breaks at
        # runtime. See contrib/release/macos/README.md and
        # contrib/release/macos/coincube.entitlements.
        run: rcodesign sign --for-notarization --entitlements-xml-path contrib/release/macos/coincube.entitlements --p12-file cert.p12 --p12-password-file cert.pass Tenshu.app

      # The pipeline otherwise only proves the app is signed and notarized,
      # not that the signature carries what the app needs. Without
      # keychain-access-groups the device secret can't be written and Cube
      # creation fails on every user's machine with -34018. Runs before
      # notarization so a bad signature fails in seconds, not 30 minutes.
      - name: Verify signature, entitlement and provisioning profile
        if: matrix.platform == 'macos'
        run: |
          entitlements=$(codesign -d --entitlements - Tenshu.app 2>&1)
          echo "$entitlements"
          echo "$entitlements" | grep -q 'keychain-access-groups' \
            || { echo "entitlement missing from signature"; exit 1; }
          echo "$entitlements" | grep -q '8UVR249AD5.io.coincube.tenshu' \
            || { echo "keychain access group is not 8UVR249AD5.io.coincube.tenshu"; exit 1; }

          # The entitlement whose absence shipped a dead passkey path in every
          # artifact up to 2026-08-07. AuthenticationServices refuses WebAuthn to
          # a process carrying no application identifier and fails every ceremony
          # with ASAuthorizationError 1004 — while codesign, notarization and
          # spctl all pass, so nothing upstream of a user notices. The embedded
          # profile has always GRANTED the key, but a grant is not a request: it
          # has to be in coincube.entitlements to reach the signature.
          #
          # This matters most here: the nightly is the build people actually
          # install, and it is the one that shipped the flag on with the
          # entitlement absent.
          #
          # Asserted by key rather than by grep, because keychain-access-groups
          # and com.apple.application-identifier carry the SAME value here — a
          # substring match over the whole blob cannot tell which key it found,
          # which also means the grep above is satisfied by either one.
          codesign -d --entitlements - --xml Tenshu.app 2>/dev/null > entitlements.plist
          appid=$(/usr/libexec/PlistBuddy -c "Print :com.apple.application-identifier" entitlements.plist 2>/dev/null) \
            || { echo "com.apple.application-identifier missing from the signature — every passkey ceremony would fail with ASAuthorizationError 1004"; exit 1; }
          [ "$appid" = "8UVR249AD5.io.coincube.tenshu" ] \
            || { echo "com.apple.application-identifier is '$appid', expected 8UVR249AD5.io.coincube.tenshu — unlike the wildcard-granted entitlements this must match the profile exactly"; exit 1; }
          echo "com.apple.application-identifier = $appid"

          # With the value above pinned by key, pin the access group the same way
          # so the grep further up cannot be satisfied by the app identifier alone.
          group=$(/usr/libexec/PlistBuddy -c "Print :keychain-access-groups:0" entitlements.plist 2>/dev/null) \
            || { echo "keychain-access-groups missing from the signature"; exit 1; }
          [ "$group" = "8UVR249AD5.io.coincube.tenshu" ] \
            || { echo "keychain access group is '$group', expected 8UVR249AD5.io.coincube.tenshu"; exit 1; }
          echo "keychain-access-groups = $group"
          rm -f entitlements.plist

          # The entitlement is worse than useless without a profile authorising
          # it — the app won't launch. An expired profile fails identically, and
          # neither failure is visible at sign, notarize or spctl time, so it
          # has to be checked here or discovered by a user.
          profile=Tenshu.app/Contents/embedded.provisionprofile
          test -f "$profile" || { echo "provisioning profile missing from bundle"; exit 1; }
          security cms -D -i "$profile" > profile.plist 2>/dev/null
          plutil -extract Entitlements.keychain-access-groups.0 raw -o - profile.plist \
            | grep -q '^8UVR249AD5' \
            || { echo "profile does not grant the 8UVR249AD5 keychain access group"; exit 1; }
          expiry=$(plutil -extract ExpirationDate raw -o - profile.plist)
          days=$(( ( $(date -j -f "%Y-%m-%dT%H:%M:%SZ" "$expiry" +%s) - $(date +%s) ) / 86400 ))
          echo "provisioning profile valid for $days more days (expires $expiry)"
          [ "$days" -gt 0 ] || { echo "the embedded provisioning profile has expired"; exit 1; }
          rm -f profile.plist

          # A profile authorises specific CERTIFICATES, not just an App ID, so
          # signing with a different Developer ID cert for the same team — a
          # rotated one, or an older p12 still in the signing secret — is
          # rejected by AMFI at exec. Nothing above catches it: the common names
          # are identical, codesign and spctl pass, and notarization succeeds.
          # The app is simply SIGKILLed on every user's machine.
          # Read the certificate back out of the finished signature rather than
          # out of the p12: that is what AMFI will judge, and it needs no secret.
          contrib/release/macos/check-profile-authorises-cert.sh \
            "$profile" --signed-bundle Tenshu.app

      # Every artifact built between 2026-04-15 and 2026-08-06 shipped without
      # the Spark bridge, and nothing in this pipeline noticed: codesign,
      # notarization and spctl all pass on a bundle with no Spark in it. Only an
      # explicit contents assertion catches it, so this step is the whole point
      # of bundling the bridge — without it the next workflow edit can drop the
      # binary again and ship green. Runs before notarization so a bad bundle
      # fails in seconds rather than half an hour.
      - name: Verify Spark bridge is bundled, correct arch, signed and runnable
        if: matrix.platform == 'macos'
        run: |
          bridge=Tenshu.app/Contents/MacOS/coincube-spark-bridge

          # (1) Present at all — the failure this exists to catch.
          test -f "$bridge" \
            || { echo "coincube-spark-bridge missing from Tenshu.app/Contents/MacOS"; exit 1; }

          # (2) Built for this leg's architecture. A wrong-arch bridge is still
          #     found by resolve_bridge_path() — it just dies on exec, which
          #     surfaces to the user as the same "not configured" message.
          case "${{ matrix.target }}" in
            aarch64-*) want=arm64 ;;
            x86_64-*)  want=x86_64 ;;
            *) echo "unhandled target ${{ matrix.target }}"; exit 1 ;;
          esac
          archs=$(lipo -archs "$bridge")
          echo "bridge architectures: $archs"
          echo "$archs" | tr ' ' '\n' | grep -qx "$want" \
            || { echo "bridge is [$archs], expected $want for ${{ matrix.target }}"; exit 1; }

          # (3) Covered by the bundle signature. Also the empirical answer to
          #     "does rcodesign --for-notarization sign a second Mach-O in
          #     Contents/MacOS?" — if this fails, the bridge needs its own
          #     rcodesign pass before the bundle is signed.
          codesign --verify --strict --verbose=2 "$bridge" \
            || { echo "bridge is not covered by the bundle signature"; exit 1; }

          # (4) It actually runs. Presence proves nothing about exec: the
          #     keychain-entitlement failure class is a SIGKILL at launch with
          #     every signing check green (docs/MACOS_KEYCHAIN_ENTITLEMENT.md).
          #     A shutdown round trip exercises exec, the hardened runtime, the
          #     tokio runtime and the JSON-RPC loop, and needs no API key, no
          #     mnemonic and no network — unlike --smoke-test, which requires
          #     COINCUBE_SPARK_MNEMONIC and transacts against Spark mainnet.
          #     Native arch only: the x64 leg cross-compiles on an arm64 runner.
          if [ "$want" = "$(uname -m)" ]; then
            out=$(echo '{"type":"request","id":1,"method":"shutdown"}' \
              | "$bridge" 2> bridge-stderr.txt) \
              || { echo "bridge failed to run:"; cat bridge-stderr.txt; exit 1; }
            echo "$out"
            echo "$out" | grep -q '"kind":"shutdown"' \
              || { echo "bridge did not answer the shutdown handshake"; cat bridge-stderr.txt; exit 1; }
            rm -f bridge-stderr.txt
          else
            echo "skipping the run check: ${{ matrix.target }} cannot exec on $(uname -m)"
          fi

      # The D4 item: the only proof the entitlement *took*. `codesign -d` shows
      # it was requested; these three tests write to the data-protection
      # keychain and read the attributes back off the stored item, which is
      # impossible without a working entitlement. Runs on arm64 only — the
      # property is not architecture-dependent, and a second run would just buy
      # another test-profile compile. Nightly rather than releases.yml so a
      # keychain hiccup on a runner cannot block shipping.
      - name: Run signed device_secret tests
        if: matrix.platform == 'macos' && matrix.arch == 'arm64'
        env:
          P12_FILE: cert.p12
          P12_PASSWORD_FILE: cert.pass
        run: contrib/release/macos/run-signed-device-secret-tests.sh

      - name: Notarize and staple app
        if: matrix.platform == 'macos'
        run: |
          base64 -D <<< "${{ secrets.APPSTORECONNECT_KEY_JSON }}" > key.json
          rcodesign notary-submit --api-key-path key.json --max-wait-seconds 1800 --staple Tenshu.app
          spctl --assess --type execute --verbose Tenshu.app

      - name: Create DMG
        if: matrix.platform == 'macos'
        run: |
          create-dmg \
            --volname "Tenshu" \
            --window-size 600 400 \
            --icon-size 128 \
            --icon "Tenshu.app" 175 120 \
            --app-drop-link 425 120 \
            "tenshu-${{ env.COINCUBE_VERSION }}-${{ matrix.target }}.dmg" \
            Tenshu.app

      - name: Upload macOS artifact
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v6
        with:
          name: tenshu-nightly-${{ env.BUILD_TAG }}-${{ matrix.target }}
          path: tenshu-${{ env.COINCUBE_VERSION }}-${{ matrix.target }}.dmg

      - name: Cleanup secrets
        if: matrix.platform == 'macos' && always()
        run: |
          rm -f cert.p12 cert.pass key.json
