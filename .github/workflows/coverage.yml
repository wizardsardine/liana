name: Coverage

on:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "coincube-spark-bridge/Cargo.lock"
      - "contrib/coverage.sh"
      - "contrib/coverage-bridge.sh"
      - ".github/workflows/coverage.yml"
  workflow_dispatch:

jobs:
  rust-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BREEZ_API_KEY: DUMMY_BREEZ_API_KEY
      CARGO_TOOLCHAIN: nightly-2026-06-17
      COVERAGE_DOCTESTS: 1
      # Current full-workspace baseline is ~26.8%. Keep the gate non-breaking
      # while focused tests ratchet this toward COVERAGE_TARGET_LINES.
      COVERAGE_TARGET_LINES: 50
      FAIL_UNDER_LINES: 26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: nightly-2026-06-17
          components: llvm-tools-preview

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libfontconfig1-dev pkg-config libdbus-1-dev protobuf-compiler libwebkit2gtk-4.1-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@528e28158500e8adf409c61ac0eaa6bdd47f49ca # cargo-llvm-cov

      # Same Secret Service setup as CI's ubuntu leg, and for the same reason:
      # the device-secret tests are deliberately not mockable — "the key half
      # lives in the OS keystore" is the property under test. A bare runner has
      # no session bus and no keyring daemon, so `org.freedesktop.secrets` is
      # absent and every test that provisions or reads a device secret fails
      # with `KeystoreUnreachable` (40 of them here, across services::unlock,
      # app and home). Coverage never got this treatment when CI did, which is
      # why it has been red since the seed hardening landed.
      #
      # Starting the daemon is not enough on its own: with no keyring file the
      # Secret Service answers a lookup for the *default* collection with "no
      # result found", and `secret-tool store` cannot mint it. Write the
      # empty-password login keyring and its default alias first.
      #
      # Keep this in step with the equivalent block in main.yml — they solve
      # one problem in two places, and a fix applied to only one of them will
      # look like a flake in the other.
      - name: Generate coverage
        run: |
          mkdir -p ~/.local/share/keyrings
          printf '[keyring]\ndisplay-name=login\nctime=0\nmtime=0\nlock-on-idle=false\nlock-after=false\n' > ~/.local/share/keyrings/login.keyring
          printf 'login' > ~/.local/share/keyrings/default
          dbus-run-session -- bash -c '
            echo -n "" | gnome-keyring-daemon --daemonize --unlock --components=secrets >/dev/null
            ./contrib/coverage.sh
          '

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage
          path: |
            target/coverage/lcov.info
            target/coverage/summary.json

  spark-bridge-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TOOLCHAIN: nightly-2026-06-17
      # Current bridge baseline is ~10.9%. The bridge is covered separately
      # because it is intentionally not part of the root Cargo workspace.
      COVERAGE_TARGET_LINES: 50
      FAIL_UNDER_LINES: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: nightly-2026-06-17
          components: llvm-tools-preview

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config protobuf-compiler gnome-keyring dbus-x11

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@528e28158500e8adf409c61ac0eaa6bdd47f49ca # cargo-llvm-cov

      - name: Generate Spark bridge coverage
        run: ./contrib/coverage-bridge.sh

      - name: Upload Spark bridge coverage artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: spark-bridge-coverage
          path: |
            target/coverage/bridge-lcov.info
            target/coverage/bridge-summary.json
