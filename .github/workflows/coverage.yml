name: Coverage

on:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "coincube-spark-bridge/Cargo.lock"
      - "contrib/coverage.sh"
      - "contrib/coverage-bridge.sh"
      - ".github/workflows/coverage.yml"
    branches:
      - master
      - redesign
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
      - converted_to_draft
  workflow_dispatch:

# Match main.yml: a new push supersedes the previous coverage run for the same
# PR instead of holding a runner for up to the full job limit.
concurrency:
  group: batch-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && github.event.changes.base == null && github.run_id || 'candidate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-coverage:
    if: ${{ (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.base != null))) }}
    runs-on: ubuntu-latest
    # The full instrumented workspace run reached 75 minutes on #1157:
    # tests and doctests passed, but the job timed out during the final report.
    # Allow report-generation headroom after cold builds and the complete
    # test suite; keep the coverage threshold and every test/report pass.
    timeout-minutes: 90
    env:
      BREEZ_API_KEY: DUMMY_BREEZ_API_KEY
      # Coverage (including the doctest pass) needs a single nightly toolchain:
      # doctest coverage requires nightly, and running the lib/bins/tests and
      # --doc passes under one toolchain keeps their profraw in one coherent set
      # for the merged report. The date was first pinned before
      # rust-lang/rust#148922 for the transitive `lightning 0.0.118`, which
      # left with breez-sdk-liquid; it stays pinned so coverage runs on a known
      # toolchain. Moving it to a newer nightly is a separate, tested change.
      CARGO_TOOLCHAIN: nightly-2026-05-15
      COVERAGE_DOCTESTS: 1
      # Current full-workspace baseline is ~26.8%. Keep the gate non-breaking
      # while focused tests ratchet this toward COVERAGE_TARGET_LINES.
      COVERAGE_TARGET_LINES: 50
      FAIL_UNDER_LINES: 26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Pinned; see the CARGO_TOOLCHAIN note above.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: nightly-2026-05-15
          components: llvm-tools-preview

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libfontconfig1-dev pkg-config libdbus-1-dev protobuf-compiler libwebkit2gtk-4.1-dev gnome-keyring dbus-x11

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@528e28158500e8adf409c61ac0eaa6bdd47f49ca # cargo-llvm-cov

      # Same Secret Service setup as CI's ubuntu leg, and for the same reason:
      # the device-secret tests are deliberately not mockable — "the key half
      # lives in the OS keystore" is the property under test. A bare runner has
      # no session bus and no keyring daemon, so `org.freedesktop.secrets` is
      # absent and every test that provisions or reads a device secret fails
      # with `KeystoreUnreachable` (40 of them here, across services::unlock,
      # app and home). Coverage never got this treatment when CI did, which is
      # why it has been red since the seed hardening landed.
      #
      # Starting the daemon is not enough on its own: with no keyring file the
      # Secret Service answers a lookup for the *default* collection with "no
      # result found", and `secret-tool store` cannot mint it. Write the
      # empty-password login keyring and its default alias first.
      #
      # Run under contrib/with_test_keyring.py, as main.yml does. A bare
      # `--daemonize` daemon that dies mid-suite is replaced by D-Bus
      # activation without a word: master's coverage run 44465792951 lost
      # its daemon at 06:44:27, one test failed with "Message recipient
      # disconnected", and an auto-activated replacement served the rest of
      # the suite. The supervisor fails such a run as infrastructure (exit
      # 125) instead, and keeps the daemon's own log.
      #
      # Keep this in step with the equivalent block in main.yml — they solve
      # one problem in two places, and a fix applied to only one of them will
      # look like a flake in the other.
      - name: Generate coverage
        run: |
          mkdir -p ~/.local/share/keyrings
          printf '[keyring]\ndisplay-name=login\nctime=0\nmtime=0\nlock-on-idle=false\nlock-after=false\n' > ~/.local/share/keyrings/login.keyring
          printf 'login' > ~/.local/share/keyrings/default
          python3 contrib/test_keyring_supervision.py
          python3 contrib/test_keyring_supervision.py --live-kill
          dbus-run-session -- python3 contrib/with_test_keyring.py -- ./contrib/coverage.sh

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage
          path: |
            target/coverage/lcov.info
            target/coverage/summary.json
            test-logs/gnome-keyring.log

  spark-bridge-coverage:
    if: ${{ (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.base != null))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Runs on the pinned stable toolchain (no CARGO_TOOLCHAIN). The bridge does
      # not collect doctest coverage, and its only lightning dep is 0.1.8, which
      # builds fine on stable — so it never needed nightly.
      # Current bridge baseline is ~10.9%. The bridge is covered separately
      # because it is intentionally not part of the root Cargo workspace.
      COVERAGE_TARGET_LINES: 50
      FAIL_UNDER_LINES: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # stable
        with:
          toolchain: "1.97.1"
          components: llvm-tools-preview

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config protobuf-compiler

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@528e28158500e8adf409c61ac0eaa6bdd47f49ca # cargo-llvm-cov

      - name: Generate Spark bridge coverage
        run: ./contrib/coverage-bridge.sh

      - name: Upload Spark bridge coverage artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: spark-bridge-coverage
          path: |
            target/coverage/bridge-lcov.info
            target/coverage/bridge-summary.json
