name: Install protoc (Windows)
description: >
  Installs a pinned protoc release from the official protobuf GitHub
  release, checks its SHA-256, and exports PROTOC for prost-build. Fails
  the step if anything goes wrong, rather than leaving the build to report
  a missing protoc later.

# Chocolatey's community feed was the previous source. When it returned
# 504s, `choco install protoc` installed nothing yet exited 0, and the
# build failed minutes later with "Could not find `protoc`".
#
# To bump: take the new version's `protoc-<v>-win64.zip` digest from
# `gh api repos/protocolbuffers/protobuf/releases/tags/v<v>`.

runs:
  using: composite
  steps:
    - name: Install protoc
      shell: pwsh
      env:
        PROTOC_VERSION: "36.2"
        PROTOC_SHA256: f0c128dc0d8492eceece83bb459a4c0e316764b929ffbf1aa416357fd644edd3
      run: |
        $ErrorActionPreference = 'Stop'
        $name = "protoc-$env:PROTOC_VERSION-win64.zip"
        $url = "https://github.com/protocolbuffers/protobuf/releases/download/v$env:PROTOC_VERSION/$name"
        $zip = Join-Path $env:RUNNER_TEMP $name
        # -MaximumRetryCount only retries HTTP error statuses; the loop also
        # retries connection-level failures (DNS, dropped or timed-out sockets).
        $attempts = 5
        for ($attempt = 1; ; $attempt++) {
          try {
            Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 10 -TimeoutSec 120
            break
          } catch {
            if ($attempt -ge $attempts) { throw }
            Write-Warning "protoc download attempt $attempt of $attempts failed: $($_.Exception.Message)"
            Start-Sleep -Seconds (10 * $attempt)
          }
        }
        $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
        if ($actual -ne $env:PROTOC_SHA256) {
          throw "protoc $env:PROTOC_VERSION checksum mismatch: expected $env:PROTOC_SHA256, got $actual"
        }
        $dir = Join-Path $env:RUNNER_TEMP 'protoc'
        Expand-Archive -Path $zip -DestinationPath $dir -Force
        $bin = Join-Path $dir 'bin'
        $protoc = Join-Path $bin 'protoc.exe'
        & $protoc --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "PROTOC=$protoc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
