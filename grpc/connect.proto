syntax = "proto3";

package connect.v1;

option go_package = "coincube/grpc/gen/connectv1;connectv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_PENDING = 1;
  SESSION_STATUS_DELIVERED = 2;
  SESSION_STATUS_VIEWED = 3;
  SESSION_STATUS_APPROVED = 4;
  SESSION_STATUS_PARTIALLY_SIGNED = 5;
  SESSION_STATUS_COMPLETED = 6;
  SESSION_STATUS_REJECTED = 7;
  SESSION_STATUS_CANCELLED = 8;
  SESSION_STATUS_EXPIRED = 9;
  SESSION_STATUS_FAILED = 10;
}

enum DevicePlatform {
  DEVICE_PLATFORM_UNSPECIFIED = 0;
  DEVICE_PLATFORM_IOS = 1;
  DEVICE_PLATFORM_ANDROID = 2;
  DEVICE_PLATFORM_DESKTOP = 3;
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_SESSION_CREATED = 1;
  EVENT_TYPE_SESSION_DELIVERED = 2;
  EVENT_TYPE_SESSION_VIEWED = 3;
  EVENT_TYPE_SESSION_APPROVED = 4;
  EVENT_TYPE_SESSION_REJECTED = 5;
  EVENT_TYPE_SIGNATURE_SUBMITTED = 6;
  EVENT_TYPE_SESSION_COMPLETED = 7;
  EVENT_TYPE_SESSION_CANCELLED = 8;
  EVENT_TYPE_SESSION_EXPIRED = 9;
  EVENT_TYPE_ERROR = 10;
  EVENT_TYPE_DEVICE_ONLINE = 11;
  EVENT_TYPE_DEVICE_OFFLINE = 12;
}

message SignerTarget {
  string device_id = 1;
  string key_fingerprint = 2;
  string key_id = 3;
  // transport_pubkey is the ECIES recipient key this device registered
  // (33-byte compressed secp256k1) — what the initiating desktop seals this
  // target's PSBT envelope to. Same encoding as
  // RegisterDeviceRequest.transport_pubkey.
  //
  // EMPTY means the device has not registered one (an older Keychain). Such a
  // target cannot take part in an ECIES_V1 session, and the initiator MUST
  // fail closed with "this keyholder's app needs updating" rather than
  // downgrade the session to plaintext.
  bytes transport_pubkey = 4;
}

// PayloadScheme declares how a signing session's PSBT and signatures are
// encoded on the rail (PLAN-connect-blinding B1).
//
// PLAINTEXT is the legacy contract: `bytes psbt` / `bytes signed_psbt` carry
// the real thing, and the server parses the PSBT to build a TxSummary.
//
// ECIES_V1 is end-to-end: the desktop seals ONE PayloadEnvelope per resolved
// signer target to that device's transport_pubkey, and the signer seals its
// signature back to the desktop's. The server relays opaque bytes, never parses
// the PSBT, and never builds a summary — the Keychain builds its own from the
// plaintext it alone can see (WYSIWYS).
//
// UNSPECIFIED means an old client that predates this field; the server treats
// it as PLAINTEXT so existing desktops keep working unchanged.
enum PayloadScheme {
  PAYLOAD_SCHEME_UNSPECIFIED = 0;
  PAYLOAD_SCHEME_PLAINTEXT = 1;
  PAYLOAD_SCHEME_ECIES_V1 = 2;
}

// PayloadEnvelope is one ECIES-sealed payload on the signing rail: a PSBT
// sealed to a signer device, or a signature sealed back to the desktop.
//
// Same primitives as every other envelope in the system (SPEC-ecies-v1 §1:
// secp256k1, compressed SEC1, HKDF-SHA256, AES-256-GCM). The server stores and
// relays these three fields verbatim and holds no key that can open them.
message PayloadEnvelope {
  // device_id names the target this envelope is sealed to. Set on the
  // request PSBT envelopes (one per signer target); empty on a signature
  // envelope, which is always sealed to the session creator's desktop.
  string device_id = 1;
  bytes ephemeral_pubkey = 2; // 33-byte compressed SEC1
  bytes nonce = 3;            // 12 bytes
  bytes ciphertext = 4;       // ciphertext ‖ 16-byte GCM tag
}

message SigningPolicySummary {
  uint32 required_signatures = 1;
  repeated string allowed_key_ids = 2;
  bool requires_biometric = 3;
  bool requires_local_pin = 4;
  bool timelock_path = 5;
  string policy_label = 6;
}

message TxOutputSummary {
  string address = 1;
  uint64 amount_sats = 2;
  bool is_change = 3;
  string label = 4;
}

message TxSummary {
  uint64 total_input_sats = 1;
  uint64 total_output_sats = 2;
  uint64 fee_sats = 3;
  repeated TxOutputSummary outputs = 4;
  string network = 5;
}

message SubmittedSignature {
  string device_id = 1;
  // signed_psbt carries the real partially-signed PSBT on a PLAINTEXT session,
  // and is EMPTY on an ECIES_V1 session (see signature_envelope).
  bytes signed_psbt = 2;
  repeated string signed_key_ids = 3;
  google.protobuf.Timestamp created_at = 4;
  // signature_envelope is the ECIES_V1 counterpart: the signed PSBT sealed to
  // the session creator's desktop transport pubkey. Opaque to the server.
  PayloadEnvelope signature_envelope = 5;
}

message SigningSession {
  string session_id = 1;
  string request_id = 2;
  string user_id = 3;
  string vault_id = 4;
  string descriptor_id = 5;
  // psbt carries the real PSBT on a PLAINTEXT session, and is EMPTY on an
  // ECIES_V1 session (see psbt_envelopes).
  bytes psbt = 6;
  // tx_summary is server-built from the PSBT and is therefore ABSENT on an
  // ECIES_V1 session — the server cannot read the transaction. The Keychain
  // builds its own summary from the plaintext it decrypts (WYSIWYS).
  TxSummary tx_summary = 7;
  SigningPolicySummary policy_summary = 8;
  repeated SignerTarget targets = 9;
  SessionStatus status = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp expires_at = 12;
  string created_by_device_id = 13;
  string note = 14;
  repeated SubmittedSignature submitted_signatures = 15;
  // is_recovery_spend records that this session spends the vault's recovery
  // branch (inheritance recovery). Server-recorded at creation after the
  // recovery gate passes; lets clients render recovery sessions distinctly.
  bool is_recovery_spend = 16;
  // payload_scheme declares how psbt / signatures are encoded on this session.
  PayloadScheme payload_scheme = 17;
  // psbt_envelopes holds one sealed PSBT per signer target on an ECIES_V1
  // session (empty on PLAINTEXT). A signer reads the entry whose device_id is
  // its own; it cannot open anyone else's, and neither can the server.
  repeated PayloadEnvelope psbt_envelopes = 18;
  // creator_transport_pubkey is the CREATING desktop's ECIES recipient key
  // (33-byte compressed secp256k1), taken from that device's registration.
  //
  // WITHOUT THIS, RAIL 1 CANNOT COMPLETE. SubmittedSignature.signature_envelope
  // is sealed to the session creator, and a signer has no other way to learn
  // that key: SignerTarget.transport_pubkey is the signer's OWN, ResolveSigners
  // is owner-only and returns signer targets, and DeviceService exposes no
  // lookup. So it rides the session every signer already fetches.
  //
  // Public material, and every recipient is already a participant in this
  // session. EMPTY means the creating device registered before transport keys
  // existed; a signer MUST then refuse an ECIES_V1 session rather than sign
  // something it cannot return (the server refuses to create one, so an empty
  // value here should only ever appear on a PLAINTEXT session).
  bytes creator_transport_pubkey = 19;
}

message CreateSigningSessionRequest {
  string request_id = 1;
  string vault_id = 2;
  string descriptor_id = 3;
  bytes psbt = 4;
  repeated SignerTarget targets = 5;
  string note = 6;
  google.protobuf.Duration ttl = 7;
  bool require_user_presence = 8;
  // is_recovery_spend declares that this PSBT spends the vault's recovery
  // branch. The server cannot infer the spent branch from the PSBT, so the
  // client must declare it; the server then gates creation on the recovery
  // path being open (keyholder caller + monitoring state available/reminding +
  // owner not under duress). Ignored (false) for ordinary owner-branch spends.
  bool is_recovery_spend = 9;
  // payload_scheme selects the rail contract. Omitted/UNSPECIFIED is treated as
  // PLAINTEXT so pre-blinding desktops keep working.
  PayloadScheme payload_scheme = 10;
  // psbt_envelopes is REQUIRED for ECIES_V1 and must contain exactly one entry
  // per declared target; `psbt` must then be empty. The reverse holds for
  // PLAINTEXT. Mixing the two is rejected at create — there is no downgrade.
  repeated PayloadEnvelope psbt_envelopes = 11;
}

message CreateSigningSessionResponse {
  SigningSession session = 1;
}

message GetSigningSessionRequest {
  string session_id = 1;
}

message GetSigningSessionResponse {
  SigningSession session = 1;
}

message CancelSigningSessionRequest {
  string session_id = 1;
  string reason = 2;
}

message CancelSigningSessionResponse {}

message ApproveSessionRequest {
  string session_id = 1;
  string approval_token = 2;
}

message ApproveSessionResponse {}

message RejectSessionRequest {
  string session_id = 1;
  string reason = 2;
}

message RejectSessionResponse {}

message MarkDeliveredRequest {
  string session_id = 1;
}

message MarkDeliveredResponse {}

message MarkViewedRequest {
  string session_id = 1;
}

message MarkViewedResponse {}

message SubmitPartialSignatureRequest {
  string session_id = 1;
  // signed_psbt is used on a PLAINTEXT session; leave it empty on ECIES_V1.
  bytes signed_psbt = 2;
  repeated string signed_key_ids = 3;
  // signature_envelope is REQUIRED on an ECIES_V1 session: the signed PSBT
  // sealed to the session creator's desktop transport pubkey. Decided
  // 2026-08-03 — ALL rail payloads are envelopes, in both directions.
  PayloadEnvelope signature_envelope = 4;
}

message SubmitPartialSignatureResponse {
  SessionStatus status = 1;
}

message RegisterDeviceRequest {
  string device_name = 1;
  DevicePlatform platform = 2;
  string push_token = 3;
  string app_version = 4;
  string os_version = 5;
  string device_pubkey = 6;
  repeated string capabilities = 7;
  // transport_pubkey is this device's ECIES recipient key for the signing rail
  // (33-byte compressed secp256k1). BOTH sides register one: the desktop (which
  // already registers as a device, keyed on cache.account.device_id) so signers
  // can seal signatures back to it, and each Keychain so the desktop can seal
  // that signer's PSBT.
  //
  // ONE TRANSPORT-KEY CONCEPT: this is the same idea as
  // CreateDecryptRequestRequest.desktop_transport_pubkey on the inheritance
  // decrypt relay — same curve, same encoding, same "the server relays a blob
  // it cannot open" role. The relay's key is per-recovery and ephemeral; this
  // one is per-device and persistent, which is why it rides registration.
  bytes transport_pubkey = 8;
}

message RegisterDeviceResponse {
  string device_id = 1;
}

message UpdatePushTokenRequest {
  string device_id = 1;
  string push_token = 2;
}

message UpdatePushTokenResponse {}

message StreamEnvelope {
  oneof body {
    ClientHello client_hello = 1;
    ClientAck client_ack = 2;
    SessionEvent session_event = 3;
    ErrorEvent error = 4;
    Ping ping = 5;
    Pong pong = 6;
    DuressActivatedEvent duress_activated = 7;
    DuressClearedEvent duress_cleared = 8;
    // Inheritance decrypt relay (best-effort live push; backed by the
    // ListPendingDecryptRequests / GetDecryptResult fetches for reliability).
    DecryptRequestedEvent decrypt_requested = 9; // → heir's Keychain
    DecryptResultEvent decrypt_result = 10;      // → heir's desktop
    DuressDisabledEvent duress_disabled = 11;
  }
}

// DuressActivatedEvent is broadcast on the existing Connect stream when an
// account enters duress, so every connected desktop / Keychain client can
// react in realtime. Offline clients reconcile via GET /connect/duress.
message DuressActivatedEvent {
  string account_id = 1;
  google.protobuf.Timestamp duress_unlock_at = 2;
  // "desktop_pin" | "auth_trigger" | "email_link" | "duress_crk_password"
  string source = 3;
}

message DuressClearedEvent {
  string account_id = 1;
  google.protobuf.Timestamp cleared_at = 2;
}

// DuressDisabledEvent is broadcast on the existing Connect stream when an
// account UNENROLLS from duress (disable), as distinct from DuressClearedEvent
// (an active episode ended; the account stays enrolled-normal). Clients act
// differently: disabled triggers a local disarm, not just exit-from-cryptic.
// Best-effort; offline clients reconcile via GET /connect/duress (enrolled:false).
message DuressDisabledEvent {
  string account_id = 1;
  google.protobuf.Timestamp disabled_at = 2;
}

message ClientHello {
  string device_id = 1;
  DevicePlatform platform = 2;
  string user_agent = 3;
  repeated string subscribe_vault_ids = 4;
  int64 last_seen_event_seq = 5;
}

message ClientAck {
  int64 event_seq = 1;
}

message SessionEvent {
  int64 event_seq = 1;
  EventType event_type = 2;
  string session_id = 3;
  SessionStatus status = 4;
  SigningSession session = 5;
  string message = 6;
  google.protobuf.Timestamp created_at = 7;
  string device_id = 8;
}

message ListPendingSessionsRequest {}

message ListPendingSessionsResponse {
  repeated SigningSession sessions = 1;
}

message ResolveSignersRequest {
  string vault_id = 1;
}

message ResolveSignersResponse {
  repeated SignerTarget targets = 1;
  repeated UnresolvedSigner unresolved = 2;
}

message UnresolvedSigner {
  string key_id = 1;
  string key_fingerprint = 2;
  string owner_user_id = 3;
  // Machine-readable reason: "no_device_registered" | "all_devices_revoked" | "owner_unknown".
  string reason = 4;
}

message ErrorEvent {
  string code = 1;
  string message = 2;
  string session_id = 3;
}

message Ping {
  int64 ts_unix_ms = 1;
}

message Pong {
  int64 ts_unix_ms = 1;
}

// ─── Inheritance heir-escrow ECIES decrypt relay (COIN-377, rev 3) ──────────
//
// The heir's Keychain holds the recovery private key and is the ONLY party that
// can derive the envelope's symmetric key (ECDH against the ephemeral pubkey +
// HKDF). The Keychain is a stream CLIENT (RealtimeService.Connect), not a
// callable server, so the decrypt is brokered async over the Connect rail,
// mirroring the signing event→fetch→submit pattern:
//
//   1. heir desktop  → CreateDecryptRequest        (picks the envelope; supplies
//                                                    a per-recovery transport pubkey)
//   2. server        → DecryptRequestedEvent       (stream-pushed to the Keychain;
//                                                    also fetchable via ListPending…)
//   3. heir Keychain → SubmitDecryptResult         (approves; ECDH+HKDF → K; wraps
//                                                    K to the desktop transport pubkey)
//                      or RejectDecryptRequest
//   4. server        → DecryptResultEvent          (stream-pushed to the desktop;
//                                                    also fetchable via GetDecryptResult)
//   5. heir desktop  unwraps K with its transport priv key, AES-256-GCM-opens
//                    the envelope, and restores — all locally.
//
// SERVER-BLIND (invariant I1): K is never relayed in the clear. The Keychain
// ECIES-WRAPS K to the desktop's transport pubkey, so the API only ever stores /
// relays an opaque blob it has no key to open — even though it also holds the
// envelope ciphertext. The wrap format is SPEC-ecies-v1.md (same ECIES as the
// envelope). See keychain-app + coincube desktop plans.

enum DecryptRequestStatus {
  DECRYPT_REQUEST_STATUS_UNSPECIFIED = 0;
  DECRYPT_REQUEST_STATUS_PENDING = 1;   // awaiting the heir's Keychain
  DECRYPT_REQUEST_STATUS_COMPLETED = 2; // wrapped_shared_key is available
  DECRYPT_REQUEST_STATUS_REJECTED = 3;  // Keychain declined (approval denied / heir duress)
  DECRYPT_REQUEST_STATUS_EXPIRED = 4;   // not answered within the TTL
}

// CreateDecryptRequest is called by the heir's DESKTOP. The server identifies the
// envelope addressed to the caller's keyholder key for (cube_id, artifact_kind),
// applies the same gate as the recovery-envelope endpoint (keyholder + recovery
// path open on-chain + owner not in duress), and notifies the heir's Keychain.
message CreateDecryptRequestRequest {
  string request_id = 1;   // client-generated idempotency key
  string cube_id = 2;
  string artifact_kind = 3; // "descriptor" | "seed" — which envelope to decrypt
  // Per-recovery transport public key (compressed 33-byte secp256k1) that the
  // Keychain wraps the derived key to. Lets the server stay blind: it relays only
  // a blob encrypted to the desktop. The desktop holds the matching private key
  // in memory for this recovery only.
  bytes desktop_transport_pubkey = 4;
}
message CreateDecryptRequestResponse {
  string request_id = 1;
  DecryptRequestStatus status = 2;
}

// DecryptRequestedEvent is delivered to the heir's Keychain (stream push +
// ListPendingDecryptRequests fetch). It carries the envelope params the Keychain
// needs to ECDH/HKDF — all already held by the server; the server never holds the
// heir's private key.
message DecryptRequestedEvent {
  string request_id = 1;
  string cube_id = 2;
  string artifact_kind = 3;
  bytes ephemeral_pubkey = 4;          // 33-byte compressed, from the envelope
  string derivation = 5;               // dedicated-child path (invariant I5)
  string purpose = 6;                  // ECIES scheme tag (SPEC-ecies-v1.md)
  bytes desktop_transport_pubkey = 7;  // wrap target — see CreateDecryptRequest
}

message ListPendingDecryptRequestsRequest {}
message ListPendingDecryptRequestsResponse {
  repeated DecryptRequestedEvent requests = 1;
}

// SubmitDecryptResult is called by the heir's Keychain after biometric/PIN
// approval. wrapped_shared_key is the derived symmetric key ECIES-wrapped to the
// request's desktop_transport_pubkey — OPAQUE to the server (SPEC-ecies-v1.md
// wrap format). The Keychain NEVER returns the private key, the raw shared key,
// or any plaintext.
message SubmitDecryptResultRequest {
  string request_id = 1;
  bytes wrapped_shared_key = 2;
}
message SubmitDecryptResultResponse {
  DecryptRequestStatus status = 1;
}

// RejectDecryptRequest is called by the Keychain when the heir declines or is
// under duress. reason is a non-sensitive machine tag ("declined" | "duress").
message RejectDecryptRequestRequest {
  string request_id = 1;
  string reason = 2;
}
message RejectDecryptRequestResponse {}

// DecryptResultEvent is delivered to the heir's DESKTOP (stream push +
// GetDecryptResult fetch). wrapped_shared_key is present only when COMPLETED and
// is opaque to the server.
message DecryptResultEvent {
  string request_id = 1;
  DecryptRequestStatus status = 2;
  bytes wrapped_shared_key = 3;
}

message GetDecryptResultRequest {
  string request_id = 1;
}
message GetDecryptResultResponse {
  DecryptRequestStatus status = 1;
  bytes wrapped_shared_key = 2;
}

service SessionService {
  rpc CreateSigningSession(CreateSigningSessionRequest) returns (CreateSigningSessionResponse);
  rpc GetSigningSession(GetSigningSessionRequest) returns (GetSigningSessionResponse);
  rpc ListPendingSessions(ListPendingSessionsRequest) returns (ListPendingSessionsResponse);
  rpc CancelSigningSession(CancelSigningSessionRequest) returns (CancelSigningSessionResponse);
  rpc MarkDelivered(MarkDeliveredRequest) returns (MarkDeliveredResponse);
  rpc MarkViewed(MarkViewedRequest) returns (MarkViewedResponse);
  rpc ApproveSession(ApproveSessionRequest) returns (ApproveSessionResponse);
  rpc RejectSession(RejectSessionRequest) returns (RejectSessionResponse);
  rpc SubmitPartialSignature(SubmitPartialSignatureRequest) returns (SubmitPartialSignatureResponse);
  rpc ResolveSigners(ResolveSignersRequest) returns (ResolveSignersResponse);

  // Heir-escrow ECIES decrypt relay (server-blind; see the message block above).
  // The server brokers the request to the heir's Keychain and relays back only
  // an opaque wrapped key — it never sees the derived key or any plaintext.
  rpc CreateDecryptRequest(CreateDecryptRequestRequest) returns (CreateDecryptRequestResponse);                   // heir desktop
  rpc ListPendingDecryptRequests(ListPendingDecryptRequestsRequest) returns (ListPendingDecryptRequestsResponse); // heir Keychain
  rpc SubmitDecryptResult(SubmitDecryptResultRequest) returns (SubmitDecryptResultResponse);                      // heir Keychain
  rpc RejectDecryptRequest(RejectDecryptRequestRequest) returns (RejectDecryptRequestResponse);                   // heir Keychain
  rpc GetDecryptResult(GetDecryptResultRequest) returns (GetDecryptResultResponse);                               // heir desktop
}

service DeviceService {
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse);
  rpc UpdatePushToken(UpdatePushTokenRequest) returns (UpdatePushTokenResponse);
}

service RealtimeService {
  rpc Connect(stream StreamEnvelope) returns (stream StreamEnvelope);
}
