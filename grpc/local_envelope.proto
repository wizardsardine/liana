syntax = "proto3";

// Local-signer LAN transport between a paired COINCUBE desktop and the
// keychain phone app. Carried over a length-prefixed TLS 1.3 connection
// where both ends present self-signed certificates pinned via the pairing
// QR (and persisted in the pairing store thereafter).
//
// The phone and desktop implementations share this wire definition; keep
// this file byte-identical between the repos and use the
// `sync-local-envelope-proto` Makefile target to propagate changes.
package coincube.local.v1;

option go_package = "coincube/grpc/gen/localenvelopev1;localenvelopev1";

import "connect.proto";  // reuse SigningSession, SessionStatus, etc.

message LocalEnvelope {
  oneof payload {
    // Peer ↔ peer setup
    PairingComplete pairing_complete = 1;  // phone → desktop, post-handshake
    // Ping/Pong are shared with the Connect transport — same int64
    // ts_unix_ms shape, so there's no value in defining local copies.
    connect.v1.Ping ping             = 2;
    connect.v1.Pong pong             = 3;

    // Signing request (desktop → phone)
    PresentSession  present_session  = 4;  // contains SigningSession
    CancelSession   cancel_session   = 5;

    // Phone responses
    SessionStatusUpdate status_update = 6;  // delivered / viewed / approved / rejected
    PartialSignature    partial       = 7;  // signed PSBT bytes
    ErrorEnvelope       error         = 8;
  }
}

// Sent by the phone immediately after the pairing TLS handshake succeeds.
// Carries the SHA-256 of the phone's self-signed certificate DER so the
// desktop can pin it for steady-state mutual auth, plus identifying metadata
// that surfaces in the desktop's signer-list UI.
message PairingComplete {
  // SHA-256 of the phone's self-signed certificate DER, hex-encoded
  // (64 lowercase hex chars).
  string phone_cert_fp           = 1;
  string device_name             = 2;
  string app_version             = 3;
  repeated string capabilities   = 4;  // ["sign_psbt", "biometric_auth"]
  // Channel-bound proof that the peer scanned THIS QR — closes the
  // unpinned-dial MITM.
  //
  //   pairing_proof = HMAC-SHA256(
  //     key = psk_bytes,                         (from the QR's `psk` field)
  //     msg = "coincube-pair-v2" ||
  //           desktop_cert_fp_hex_ascii ||       (lowercase, 64 chars)
  //           phone_cert_fp_hex_ascii            (lowercase, 64 chars)
  //   )
  //
  // Emitted as lowercase hex (64 chars). Empty for v1 PairingOffer peers
  // (no psk in the QR → no proof to compute). The desktop must verify
  // before pinning the cert.
  string pairing_proof           = 5;
  // The phone's ECIES transport public key (33-byte compressed secp256k1).
  // Required for descriptor-blinded LAN signing: the desktop seals both the
  // PSBT and canonical descriptor to it. A missing/malformed key forces a
  // re-pair; it must never select a descriptor_id-only fallback.
  bytes transport_pubkey         = 6;
  // Exact local key selected by the scanned QR. Authenticated by the same
  // TLS channel and v2 QR proof; never inferred from a master fingerprint.
  // Missing identity requires re-pairing. Only the selected vault key is shared.
  SignerBinding signer_binding   = 7;
}

message PresentSession {
  connect.v1.SigningSession session = 1;
}

message CancelSession {
  string session_id = 1;
  string reason     = 2;
}

message SessionStatusUpdate {
  string session_id = 1;
  connect.v1.SessionStatus status = 2;
}

message PartialSignature {
  string session_id              = 1;
  // Legacy plaintext field. Empty for every ECIES_V1 session.
  bytes  signed_psbt             = 2;
  repeated string signed_key_ids = 3;
  // The ECIES_V1 signed PSBT, sealed to
  // SigningSession.creator_transport_pubkey with request_id-bound AAD.
  connect.v1.PayloadEnvelope signature_envelope = 4;
}

message ErrorEnvelope {
  // Machine-readable code. Defined values:
  //   "replay_refused"   — session_id already signed by this device
  //   "unknown_session"  — desktop sent an id this device doesn't have
  //   "unauthorized"     — peer cert not in the pairing store
  //   "internal"         — unexpected local failure
  string code       = 1;
  string message    = 2;
  string session_id = 3;
}

// One explicitly selected vault key, independently resolved on the phone.
message SignerBinding {
  string key_id = 1;             // Local record's backend key ID.
  string xpub = 2;               // Exact extended public key, no origin/suffix.
  string fingerprint = 3;        // Display/routing metadata, not authority.
  bytes descriptor_sha256 = 4;   // All 32 bytes over canonical descriptor UTF-8.
}
