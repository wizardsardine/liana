[package]
name = "coincube-spark-bridge"
version = "0.1.0"
edition = "2021"
license-file = "../LICENCE"
description = "Sibling process that hosts breez-sdk-spark and exposes it to coincube-gui over stdin/stdout JSON-RPC"

# Standalone single-member workspace with its own Cargo.lock — deliberately
# isolated from the main coincube workspace so that breez-sdk-spark's dep
# graph (tokio_with_wasm ^0.8.7, rusqlite 0.32.1 + libsqlite3-sys) doesn't
# have to be unified with the main workspace's, where coincubed links its own
# rusqlite 0.38 fork (`links = "sqlite3"` allows one). See the main Cargo.toml
# `exclude = ["coincube-spark-bridge"]` entry for the paired side of this
# setup.
[workspace]
members = ["."]
resolver = "2"

[[bin]]
name = "coincube-spark-bridge"
path = "src/main.rs"

[lints.rust]
mismatched_lifetime_syntaxes = "allow"

# Mirrors the root Cargo.toml's `[profile.minimal]`. The release workflows
# build the gui with `--profile minimal`, and both halves of a packaged build
# have to ship under one profile — a workspace that lacks this profile fails
# the build outright ("profile `minimal` is not defined") rather than silently
# diverging, which is the point.
#
# `panic = "abort"` matches the gui. The bridge is a subprocess whose death the
# parent already handles (`SparkClientError::BridgeUnavailable`, plus
# `kill_on_drop(true)` on the child), so aborting is no worse than unwinding,
# and no test catches a panic. Note `cargo test` builds under the `test`
# profile, so this does not affect the test harness.
[profile.minimal]
inherits = "release"
opt-level = "z"
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"

[dependencies]
coincube-spark-protocol = { path = "../coincube-spark-protocol" }
# 0.19.0 made the sqlite storage backend an opt-in feature (it was implicit in
# 0.13.1, where the now-removed free `connect()` fn wired it up). Without it
# `SdkBuilder::with_default_storage` doesn't exist and the bridge has nowhere
# to persist. This is the `rusqlite`/`libsqlite3-sys` edge that makes this crate
# a separate workspace — see the `[workspace]` note above.
#
# 0.22.0+ is required: earlier releases quote a V3 concentrated Flashnet pool
# from its self-reported price with no reserve check, so an empty pool with an
# absurd tick beats the real one and every USDB conversion fails at the AMM
# (mainnet BTC/USDB, 2026-09-07; see docs/SPARK_WALLET.md, "Stable Balance").
# Upstream commit 7ba9363a ("Flashnet: validate pool data and swap responses")
# fixed it; never pin below that.
#
# 0.28.0+ is required: 0.25.0 fails the whole Flashnet pool listing when any
# pool has a field its model can't take (`"hostName": null` appeared on
# mainnet BTC/USDB on 2026-09-11), so every conversion reports
# `NoPoolsAvailable`. Upstream commit a781273b fixed it. 0.28.0 also brings
# the backoff for failed Stable Balance conversions and
# `SdkEvent::StableBalanceConversionFailed`, which until then came from the
# coincubetech fork (`coincube/0.25.0-stable-balance-hardening`).
#
# That fork's fourth commit, dropping pools priced far from the deepest
# pool's, is deliberately not carried: Breez declined it (breez/spark-sdk#1114)
# with fake pools that slip past it or even make the real pool the one
# dropped. A pool can still win selection on a price it has almost no
# liquidity behind; the conversion then fails at the AMM, and the bridge's
# circuit breaker pauses auto-convert. See docs/SPARK_WALLET.md.
breez-sdk-spark = { git = "https://github.com/breez/spark-sdk", tag = "0.28.1", features = [
    "sqlite",
] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "io-std",
    "io-util",
    "sync",
    "signal",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

# See root Cargo.toml: same dev-profile debuginfo trade-off, repeated because
# this is a separate workspace and would not otherwise inherit it.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
