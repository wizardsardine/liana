[package]
name = "coincube-gui"
version = "1.0.0"
readme = "README.md"
description = "COINCUBE GUI - Secure Bitcoin wallet with multisig and inheritance"
repository = "https://github.com/coincubetech/coincube"
license-file = "../LICENCE"
authors = ["Edouard Paris <m@edouard.paris>", "Coincube Team"]
edition = "2018"
resolver = "2"

[package.metadata.winres]
LegalCopyright = "Copyright © 2026"

[[bin]]
name = "coincube"
path = "src/main.rs"

[dependencies]
tempfile = "3.27"
# Official SDK 4.0.0 source at 6292bbd0; manifest-only reqwest adjustment avoids
# the existing Breez iOS build-dependency pin conflict. Drop the adaptation when
# upstream relaxes that pin or provides compatible HTTP/TLS configuration.
# See vendor/branta/TENSHU_PROVENANCE.md and its enforced source hashes.
branta = { path = "../vendor/branta", version = "=4.0.0", default-features = false }
# Decodes BIP21 query values in the Branta request pre-filter, matching the SDK.
percent-encoding = "2.3"
async-trait = "0.1"
async-hwi = "0.0.32"
# Build-only adaptation of the mirrored SDK 0.12.2 revision 94e1e184.
# Removes an unavailable upstream regtest swapproxy submodule that Cargo tries
# to fetch even for SDK consumers. SDK Rust source and manifests are unchanged.
# See COINCUBE_BUILD_PATCH.md at the pinned dependency revision.
breez-sdk-liquid = { git = "https://github.com/coincubetech/breez-sdk-liquid", rev = "4ac5017c18dd3bb174cb3f193570c0d8b6ef3afa" }
coincube-mcp = { path = "../coincube-mcp", default-features = false }
coincube-core = { path = "../coincube-core" }
coincube-spark-protocol = { path = "../coincube-spark-protocol" }
coincubed = { path = "../coincubed", default-features = false, features = [
	"nonblocking_shutdown",
] }
coincube-ui = { path = "../coincube-ui" }
backtrace = "0.3"
hex = "0.4.3"

iced = { version = "0.14.0", default-features = false, features = [
	"tokio",
	"svg",
	"canvas",
	"qr_code",
	"image-without-codecs",
	"advanced",
	"wgpu",
	"sipper",
	"crisp",
] }
iced_anim = "0.3"
image = { version = "*", default-features = false, features = ["png", "jpeg"] }
iced_aw = { version = "0.13.0", features = ["context_menu"] }
iced_runtime  = "0.14.0"

# Used to verify RFC-compliance of an email
email_address = "0.2.7"

tokio = { version = "1", features = [
	"net",
	"signal",
	"process",
	"io-util",
	"sync",
	"time",
	"macros",
	"rt",
	"rt-multi-thread",
] }
tokio-stream = "0.1"
tonic = { version = "0.13", features = ["tls-native-roots"] }
prost = "0.13"
prost-types = "0.13"
async-fd-lock = "0.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }

# Used to ping bitcoind node
jsonrpc = "0.18"

# Logging stuff
tracing = "0.1.41"
tracing-log = "0.2.0"
tracing-subscriber = "0.3.20"
log = "0.4"

dirs = "6"
toml = "0.9"
rand = "0.8"
chrono = { version = "0.4.38", features = ["serde"] }
mostro-core = "0.7"
nostr-sdk = { version = "0.43.0", features = ["nip06", "nip59"] }
bip39 = { version = "2.1.0", features = ["rand"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
unicode-segmentation = "1.0"
argon2 = { version = "0.5", features = ["std"] }

# Used for managing internal bitcoind
base64 = "0.22"
# Rasterizes Launcher face art once per content for the GPU floor. Same
# version and features iced already builds for its SVG widget.
resvg = "0.45"
bitcoin_hashes = "0.16"
reqwest = { version = "0.12.18", default-features = false, features = [
	"json",
	"rustls-tls",
	"stream",
] }
reqwest-sse = "0.1"
rust-ini = "0.21"
rfd = "0.15.1"
# Same version iced's QR widget encodes with; renders the saved QR image.
qrcode = { version = "0.13", default-features = false }
fs4 = { version = "0.13", features = ["sync"] }

# Used for opening URLs in browser
open = "5.3"

# Webview for embedded browser functionality (wry-based)
iced_wry = { git = "https://github.com/sokorototo/iced_wry" }

keyring = { version = "3.2.0", features = [
	"apple-native",
	"windows-native",
	"sync-secret-service",
] }

encrypted_backup = { version = "=0.0.2", default-features = false, features = [
	"miniscript_12_0",
	"rand",
], package = "bitcoin-encrypted-backup" }

# CTAP2 over HID, for the FIDO2 security-key backend. This is what makes Linux
# acceptable — it has no platform authenticator — and it is also the fallback
# for Windows machines below the Windows Hello PRF floor (11 25H2).
ctap-hid-fido2 = "3.5"

zeroize = { version = "1", features = ["derive"] }
chacha20poly1305 = "0.10.1"
aes-gcm = { version = "0.10", features = ["aes"] }
sha2 = "0.11.0"
zxcvbn = "3"

# Local LAN signer (phone_signer module). TLS with cert pinning,
# self-signed cert generation, Ed25519 identity, and mDNS discovery
# for the Keychain phone app. See plans/PLAN-local-signer-lan-desktop.md.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
mdns-sd = "0.13"
# HMAC-SHA256 for the pairing proof-of-QR-scan. Already in the tree
# via rustls's `ring` feature; depending on it directly avoids the
# digest-trait version split between hmac 0.12 (digest 0.10) and sha2
# 0.11 (digest 0.11).
ring = "0.17"
# Constant-time comparison of the pairing proof MAC. `ring`'s own
# constant_time helper is deprecated ("no promises regarding side
# channels"), so use the dedicated, audited primitive.
subtle = "2"

dotenvy = "0.15.7"
pgp = "0.16"

# Used to unpack `.tar.gz` archives. The Bitcoin Core/Knots archives are tar.gz
# on Unix (Windows is a zip, handled by `zip` below), and the Tor Expert Bundle
# is a tar.gz on *every* platform — so these must be available everywhere, not
# gated to Unix.
tar = { version = "0.4", default-features = false }
flate2 = { version = "1.0", default-features = false }
hostname = "0.4.2"

[target.'cfg(windows)'.dependencies]
zip = { version = "0.6", default-features = false, features = [
	"bzip2",
	"deflate",
] }
# `webauthn.dll` bindings for the native Windows passkey backend, replacing the
# iced_wry webview. PRF is available from WebAuthn API version 6
# (make-credential) and version 8 (`pPRFGlobalEval` on get-assertion), probed at
# runtime rather than assumed.
windows = { version = "0.61", features = [
	"Win32_Security",
	"Win32_Security_Authorization",
	"Win32_Storage_FileSystem",
	"Win32_System_Threading",
	"Win32_Foundation",
	"Win32_Networking_WindowsWebServices",
	"Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# The device secret's keychain item is written through `SecItem` directly, not
# through `keyring`: keyring 3.3's macOS backend uses the legacy `SecKeychain`
# API and can set neither `kSecAttrAccessibleWhenUnlockedThisDeviceOnly` nor
# `kSecAttrSynchronizable = false`. Both are required — an item that syncs to
# iCloud uploads the second factor and defeats the design.
# See `services/unlock/device_secret/apple.rs`.
security-framework = "2.10"
security-framework-sys = "2.10"
core-foundation = "0.9"
core-foundation-sys = "0.8"

# objc2 0.6 has the PRF extension bindings (added with macOS 14 support).
# This coexists with the 0.5 version pulled in by iced/winit/wry — we're
# careful not to pass types between the two versions.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
	"NSData",
	"NSString",
	"NSError",
	"NSObject",
	"NSArray",
	"NSDictionary",
] }
objc2-authentication-services = { version = "0.3", features = [
	"ASFoundation",
	"ASAuthorization",
	"ASAuthorizationController",
	"ASAuthorizationRequest",
	"ASAuthorizationCredential",
	"ASAuthorizationPlatformPublicKeyCredentialProvider",
	"ASAuthorizationPlatformPublicKeyCredentialRegistrationRequest",
	"ASAuthorizationPlatformPublicKeyCredentialRegistration",
	"ASAuthorizationPlatformPublicKeyCredentialAssertionRequest",
	"ASAuthorizationPlatformPublicKeyCredentialAssertion",
	"ASAuthorizationPublicKeyCredentialRegistration",
	"ASAuthorizationPublicKeyCredentialAssertion",
	"ASAuthorizationPublicKeyCredentialRegistrationRequest",
	"ASAuthorizationPublicKeyCredentialAssertionRequest",
	"ASAuthorizationPublicKeyCredentialPRFRegistrationInput",
	"ASAuthorizationPublicKeyCredentialPRFAssertionInput",
	"ASAuthorizationPublicKeyCredentialPRFAssertionOutput",
	"ASAuthorizationPublicKeyCredentialPRFRegistrationOutput",
	"ASPublicKeyCredential",
	"ASAuthorizationPublicKeyCredentialDescriptor",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
iced = { version = "0.14.0", features = ["x11", "wayland"] }

[dev-dependencies]
# Claim flow mocks need a non-submitting backend binding to exercise the
# production review guard without starting a real node.
coincubed = { path = "../coincubed", default-features = false, features = ["nonblocking_shutdown", "test-utils"] }
# Keep widget regression tests independent of a GPU on every platform.
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia"] }
# `test-util` gives us `#[tokio::test(start_paused = true)]` for the
# local-signer timeout test in tests/local_signer_loopback.rs.
tokio = { version = "1", features = ["rt", "macros", "test-util"] }
httpmock = "0.7"

[features]
default = ["mcp-proposals", "mcp-transactions"]
# Native-consent workflows are included in normal builds; pairing remains opt-in.
mcp-proposals = ["coincube-mcp/native-proposals"]
mcp-transactions = ["coincube-mcp/native-transactions"]
# Opt-in test knobs for ancestry checks against a disposable regtest
# history (`CoincubeClient::enable_regtest_ancestry`).
regtest-harness = []
# Opt-in tests that hit a real `coincube-api` endpoint (production with a
# dedicated test account, or a local API; there is no dev server). Requires
# the `COINCUBE_API_URL` env var (and, for the auth-flavoured tests,
# `COINCUBE_INTEGRATION_TOKEN`) at run time. Always off in the default
# `cargo test` matrix so PR CI stays hermetic; enabled by the
# connect-integration workflow when it is switched on.
integration-tests = ["coincubed/native-recovery"]
# Debug-only signed macOS fault probe. Release builds reject its entry point.
native-anchor-probe = []

[build-dependencies]
dotenvy = "0.15.7"
tonic-build = "0.13"

winresource = "0.1"

[lints.rust]
mismatched_lifetime_syntaxes = "allow"

[lints.clippy]
uninlined_format_args = "allow"
large_enum_variant = "warn"
result_large_err = "warn"

[package.metadata.winresource]
OriginalFilename = "coincube.exe"
FileDescription = "Tenshu - Secure Bitcoin wallet with multisig and inheritance"
CompanyName = "COINCUBE TECHNOLOGY LLC"
InternalName = "Coincube"

[package.metadata.wix]
eula = false
